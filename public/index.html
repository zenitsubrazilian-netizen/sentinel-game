<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>⚔️ Duel Arena</title>
<style>
:root{
  --bg:#0d0d1a;--card:#151528;--border:#252548;
  --purple:#7c3aed;--pink:#db2777;
  --green:#10b981;--blue:#3b82f6;--gold:#f59e0b;--red:#ef4444;
  --text:#e2e8f0;--muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100dvh;display:flex;justify-content:center}
.screen{width:100%;max-width:460px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}

/* ── Loading ── */
#screen-loading{align-items:center;justify-content:center;min-height:100dvh}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Header ── */
.hdr{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.rbadge{background:var(--purple);padding:3px 10px;border-radius:20px;font-size:11px}
.rid{font-size:10px;opacity:.4}

/* ── Fighter card ── */
.fighter{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
.fighter.enemy{border-color:#3d1515}
.fighter.me   {border-color:#152840}
.fname{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px}
.fnick{font-size:11px;color:var(--gold)}
.blabel{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
.bwrap{margin-bottom:5px}
.bar{height:10px;background:#1e1e38;border-radius:5px;overflow:hidden}
.bar.thin{height:6px}
.bfill{height:100%;border-radius:5px;transition:width .5s ease}
.hp  {background:linear-gradient(90deg,#7f1d1d,#ef4444)}
.mana{background:linear-gradient(90deg,#1e3a8a,#3b82f6)}
.ult {background:linear-gradient(90deg,#78350f,#f59e0b)}
.srow{display:flex;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:4px}
.efx{font-size:10px;color:var(--gold);min-height:14px;margin-top:4px}

/* ── Log ── */
.log{background:#080814;border:1px solid var(--border);border-radius:12px;padding:10px;flex:1;min-height:110px;max-height:160px;overflow-y:auto;font-size:12px;line-height:1.65}
.log p{padding:1px 0}
.log p.sep{color:var(--muted);font-size:10px;border-top:1px solid var(--border);margin:4px 0;padding-top:4px}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Actions ── */
.agrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.btn{background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 4px;font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent;line-height:1.4}
.btn:active{transform:scale(.95);background:#1e1e38}
.btn.sp{border-color:var(--purple);color:#c4b5fd}
.btn.ul{border-color:var(--gold);color:var(--gold)}
.btn.wide{grid-column:span 3}
.btn.wide2{grid-column:span 2}
.wait-msg{text-align:center;padding:12px;color:var(--muted);font-size:13px;background:var(--card);border-radius:10px;border:1px dashed var(--border)}

/* ── Spells overlay ── */
.soverlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.spanel{background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--border);padding:16px;width:100%;max-width:460px;max-height:72vh;overflow-y:auto}
.stitle{font-size:15px;font-weight:700;margin-bottom:12px;text-align:center;color:#c4b5fd}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scard{background:#1a1a34;border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;transition:all .15s}
.scard:active{transform:scale(.97)}
.scard.cd,.scard.nm{opacity:.38;pointer-events:none}
.sicon{font-size:20px}
.sname{font-size:12px;font-weight:700;margin:4px 0 2px}
.sdesc{font-size:10px;color:var(--muted)}
.scost{font-size:10px;color:#60a5fa;margin-top:2px}
.cls{display:block;width:100%;margin-top:12px;padding:10px;background:#252548;border:none;border-radius:10px;color:var(--text);font-size:13px;cursor:pointer}

/* ── End ── */
.end-card{background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;border:1px solid var(--border);margin-top:20px}
.end-emoji{font-size:48px;margin-bottom:8px}
.end-ttl{font-size:22px;font-weight:800;margin-bottom:12px}
.end-stats{font-size:14px;color:var(--muted);line-height:2}
.end-log{background:#080814;border:1px solid var(--border);border-radius:12px;padding:10px;max-height:260px;overflow-y:auto;font-size:11px;line-height:1.6}
</style>
</head>
<body>

<!-- Loading -->
<div id="screen-loading" class="screen" style="align-items:center;justify-content:center;min-height:100dvh">
  <div class="spinner"></div>
  <div style="margin-top:14px;font-size:15px">⚔️ Conectando à arena...</div>
</div>

<!-- Battle -->
<div id="screen-battle" class="screen hidden">
  <div class="hdr">
    <span>⚔️ DUEL</span>
    <span id="rbadge" class="rbadge">Round 1</span>
    <span id="rid" class="rid"></span>
  </div>

  <div class="fighter enemy">
    <div class="fname">
      <span id="ename">🤖 Sentinel</span>
      <span class="fnick" id="eult">✨ 0/100</span>
    </div>
    <div class="bwrap">
      <div class="blabel"><span>❤️ HP</span><span id="ehptxt">120/120</span></div>
      <div class="bar"><div id="ehpbar" class="bfill hp" style="width:100%"></div></div>
    </div>
    <div class="bwrap">
      <div class="blabel"><span>🔵 Mana</span><span id="emanatxt">60/60</span></div>
      <div class="bar"><div id="emanabar" class="bfill mana" style="width:100%"></div></div>
    </div>
    <div class="srow">
      <span id="eenergy">⚡ 50/50</span>
      <span id="epotions">🧪 2</span>
    </div>
    <div class="efx" id="eefx"></div>
  </div>

  <div class="log" id="log"><p style="color:var(--muted);text-align:center">⚔️ A batalha começa!</p></div>

  <div class="fighter me">
    <div class="fname">
      <span id="myname">👤 Você</span>
      <span class="fnick" id="myult">✨ 0/100</span>
    </div>
    <div class="bwrap">
      <div class="blabel"><span>❤️ HP</span><span id="myhptxt">120/120</span></div>
      <div class="bar"><div id="myhpbar" class="bfill hp" style="width:100%"></div></div>
    </div>
    <div class="bwrap">
      <div class="blabel"><span>🔵 Mana</span><span id="mymanatxt">60/60</span></div>
      <div class="bar"><div id="mymanabar" class="bfill mana" style="width:100%"></div></div>
    </div>
    <div class="bwrap">
      <div class="blabel"><span>✨ Ultimate</span><span id="myulttxt">0/100</span></div>
      <div class="bar thin"><div id="myultbar" class="bfill ult" style="width:0%"></div></div>
    </div>
    <div class="srow">
      <span id="myenergy">⚡ 50/50</span>
      <span id="mypotions">🧪 2</span>
    </div>
    <div class="efx" id="myefx"></div>
  </div>

  <div id="agrid" class="agrid">
    <button class="btn" onclick="act('ataque leve')">⚔️ Leve<br><small>8-15 dmg</small></button>
    <button class="btn" onclick="act('ataque pesado')">💢 Pesado<br><small>20-32 (-15⚡)</small></button>
    <button class="btn" onclick="act('defesa')">🛡️ Defesa<br><small>-50% dano</small></button>
    <button class="btn" onclick="act('esquiva')">💨 Esquiva<br><small>40% evitar</small></button>
    <button class="btn" onclick="act('contra-ataque')">↩️ Contra<br><small>(-20⚡)</small></button>
    <button class="btn" onclick="act('break guard')">🔨 Break<br><small>(-25⚡)</small></button>
    <button class="btn" onclick="act('focus')">🧘 Focus<br><small>+mana +⚡</small></button>
    <button class="btn" onclick="act('usar item')">🧪 Poção<br><small>+30-45 HP</small></button>
    <button class="btn ul" onclick="act('ultimate')">✨ Ultimate<br><small>45-65 dano</small></button>
    <button class="btn sp wide2" onclick="showSpells()">🔮 Magia<br><small>escolher feitiço</small></button>
  </div>
  <div id="waitmsg" class="wait-msg hidden">⏳ Aguardando...</div>
</div>

<!-- Spells overlay -->
<div id="soverlay" class="soverlay hidden" onclick="hideSpells(event)">
  <div class="spanel" onclick="event.stopPropagation()">
    <div class="stitle">🔮 Escolher Magia</div>
    <div class="sgrid" id="sgrid"></div>
    <button class="cls" onclick="hideSpells()">✖ Fechar</button>
  </div>
</div>

<!-- End -->
<div id="screen-end" class="screen hidden">
  <div class="end-card">
    <div class="end-emoji" id="end-emoji">🏆</div>
    <div class="end-ttl"  id="end-ttl">Vitória!</div>
    <div class="end-stats" id="end-stats"></div>
  </div>
  <div class="end-log" id="end-log"></div>
</div>

<script type="module">
import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, updateDoc }
                                from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

// ════════════════════════════════════════
// ⚙️  EDITE COM SUA CONFIG DO FIREBASE
// ════════════════════════════════════════
const FB = {
  apiKey:            "SUA_API_KEY",
  authDomain:        "SEU_PROJETO.firebaseapp.com",
  projectId:         "SEU_PROJETO_ID",
  storageBucket:     "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId:             "SEU_APP_ID"
};
// ════════════════════════════════════════

const app     = initializeApp(FB);
const db      = getFirestore(app);
const params  = new URLSearchParams(location.search);
const ROOM_ID = params.get('room');
const PLAYER  = params.get('player');  // 'p1' ou 'p2'
const ENEMY   = PLAYER === 'p1' ? 'p2' : 'p1';

if (!ROOM_ID || !['p1','p2'].includes(PLAYER)) {
  el('screen-loading').innerHTML =
    '<div style="padding:40px;text-align:center;color:#ef4444">⚠️ Link inválido.<br>Use o link enviado pelo bot no PV.</div>';
  throw new Error('Invalid params');
}

const roomRef = doc(db, 'rooms', ROOM_ID);
let   room    = null;
let   actionSent = false;
let   resolving  = false;

// ── Helpers ─────────────────────────────
const rand  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const chance= p => Math.random()*100 < p;
const el    = id => document.getElementById(id);
const esc   = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── Spells ──────────────────────────────
const SP = {
  bola_de_fogo:  {id:'bola_de_fogo',  name:'Bola de Fogo',      icon:'🔥',cost:25,cd:2,type:'damage',  pw:{n:20,x:30},eff:{type:'burning',  rounds:2,dot:5},       desc:'20-30 dano + queimadura 2r'},
  raio:          {id:'raio',          name:'Raio',               icon:'⚡',cost:30,cd:3,type:'damage',  pw:{n:25,x:40},eff:{type:'stun',     rounds:1},             desc:'25-40 dano + stun 1r'},
  gelo:          {id:'gelo',          name:'Tempestade de Gelo', icon:'🧊',cost:20,cd:2,type:'damage',  pw:{n:15,x:22},eff:{type:'frozen',   rounds:2},             desc:'15-22 dano + congela 2r'},
  veneno:        {id:'veneno',        name:'Nuvem de Veneno',    icon:'☠️',cost:15,cd:2,type:'damage',  pw:{n:8, x:12},eff:{type:'poisoned', rounds:3,dot:6},       desc:'8-12 dano + veneno 3r'},
  cura:          {id:'cura',          name:'Cura Divina',        icon:'💚',cost:20,cd:3,type:'heal',    pw:{n:30,x:45},eff:null,                                    desc:'Recupera 30-45 HP'},
  escudo_magico: {id:'escudo_magico', name:'Escudo Mágico',      icon:'🛡️',cost:18,cd:3,type:'buff',    pw:{n:0, x:0}, eff:{type:'shielded', rounds:2,reduction:.7}, desc:'-70% dano 2r'},
  furia:         {id:'furia',         name:'Fúria Guerreira',    icon:'😤',cost:20,cd:4,type:'buff',    pw:{n:0, x:0}, eff:{type:'enraged',  rounds:2,bonus:10},    desc:'+10 dano 2r'},
  fraqueza:      {id:'fraqueza',      name:'Maldição da Fraqueza',icon:'💫',cost:15,cd:3,type:'debuff', pw:{n:0, x:0}, eff:{type:'weakened', rounds:2,penalty:8},   desc:'Inimigo -8 dano 2r'},
  silencio:      {id:'silencio',      name:'Silêncio',           icon:'🔇',cost:20,cd:3,type:'debuff', pw:{n:0, x:0}, eff:{type:'silenced', rounds:2},             desc:'Bloqueia magias 2r'},
  correntes:     {id:'correntes',     name:'Correntes Eternas',  icon:'⛓️',cost:25,cd:3,type:'control', pw:{n:5, x:10},eff:{type:'chained',  rounds:2},             desc:'5-10 dano + bloqueia esquiva 2r'},
};
const SLIST = Object.keys(SP);

// ── Effect helpers ───────────────────────
const hasEff  = (p,t) => (p.effects||[]).some(e=>e.type===t&&e.rounds>0);
const getEnr  = p => { const e=(p.effects||[]).find(e=>e.type==='enraged');  return e?e.bonus:0; };
const getWkn  = p => { const e=(p.effects||[]).find(e=>e.type==='weakened'); return e?e.penalty:0; };
const lbl     = p => p.isBot ? '🤖 Sentinel' : '👤 Você';

function addEff(t, eff) {
  t.effects = (t.effects||[]).filter(e=>e.type!==eff.type);
  t.effects.push({...eff});
}

// ── Apply effects ────────────────────────
function applyEffects(p) {
  const log=[], keep=[];
  const L = lbl(p);
  for (const e of (p.effects||[])) {
    if (e.type==='burning')  { p.hp-=e.dot||5; log.push(`🔥 ${L} queimando! -${e.dot||5} HP`); }
    if (e.type==='poisoned') { p.hp-=e.dot||6; log.push(`☠️ ${L} envenenado! -${e.dot||6} HP`); }
    if (e.type==='bleeding') { p.hp-=e.dot||4; log.push(`🩸 ${L} sangrando! -${e.dot||4} HP`); }
    if (e.type==='frozen')   log.push(`🧊 ${L} congelado (${e.rounds-1}r)`);
    if (e.type==='stun')     log.push(`⚡ ${L} atordoado (${e.rounds-1}r)`);
    if (e.type==='silenced') log.push(`🔇 ${L} silenciado (${e.rounds-1}r)`);
    if (e.type==='chained')  log.push(`⛓️ ${L} acorrentado (${e.rounds-1}r)`);
    if (e.type==='shielded') log.push(`🛡️ ${L} com Escudo (${e.rounds-1}r)`);
    if (e.type==='enraged')  log.push(`😤 ${L} em Fúria +${e.bonus} (${e.rounds-1}r)`);
    if (e.type==='weakened') log.push(`💫 ${L} Fraco -${e.penalty} (${e.rounds-1}r)`);
    const rem = {...e, rounds:e.rounds-1};
    if (rem.rounds>0) keep.push(rem);
  }
  p.effects = keep;
  for (const id of Object.keys(p.spellCooldowns||{})) {
    p.spellCooldowns[id]--;
    if (p.spellCooldowns[id]<=0) delete p.spellCooldowns[id];
  }
  if ((p.regenPerRound||0)>0 && p.hp>0) {
    const r=p.regenPerRound;
    p.hp=clamp(p.hp+r,0,p.maxHp);
    log.push(`💚 ${L} regenera +${r} HP`);
  }
  return log;
}

// ── Resolve spell ────────────────────────
function resolveSpell(caster, target, sid, res, log) {
  const L=lbl(caster), spell=SP[sid];
  if (!spell)                    { res.damage=rand(8,15); log.push(`❓ ${L} magia desconhecida → Ataque Leve`); return; }
  if (hasEff(caster,'silenced')) { res.damage=rand(8,15); log.push(`🔇 ${L} silenciado → Ataque Leve`); return; }
  if ((caster.spellCooldowns||{})[sid]>0) { res.damage=rand(8,15); log.push(`🔮 ${spell.name} em cooldown → Ataque Leve`); return; }
  const cost=Math.max(0,spell.cost-(caster.manaCostReduction||0));
  if ((caster.mana||0)<cost) { res.damage=rand(8,15); log.push(`🔮 ${L} sem mana → Ataque Leve`); return; }
  caster.mana-=cost;
  if (!caster.spellCooldowns) caster.spellCooldowns={};
  caster.spellCooldowns[sid]=spell.cd;
  caster.ultimate=clamp((caster.ultimate||0)+15,0,100);
  const sp=caster.spellPowerBonus||0;
  switch (spell.type) {
    case 'damage':
      res.damage=Math.max(0,rand(spell.pw.n,spell.pw.x)+sp+getEnr(caster)-getWkn(caster));
      log.push(`${spell.icon} ${L} conjura ${spell.name}! ${res.damage} dano`);
      if (spell.eff) { addEff(target,{...spell.eff}); log.push(`  ↳ ${spell.eff.type}`); }
      break;
    case 'heal': {
      const h=rand(spell.pw.n,spell.pw.x)+Math.floor(sp*.5);
      caster.hp=clamp(caster.hp+h,0,caster.maxHp);
      res.heal=h;
      log.push(`${spell.icon} ${L} cura +${h} HP → ${caster.hp}/${caster.maxHp}`);
      break;
    }
    case 'buff':   addEff(caster,{...spell.eff}); log.push(`${spell.icon} ${L} ${spell.name}! Buff ativo.`); break;
    case 'debuff': addEff(target,{...spell.eff}); log.push(`${spell.icon} ${L} ${spell.name}! Debuff no inimigo.`); break;
    case 'control':
      res.damage=Math.max(0,rand(spell.pw.n,spell.pw.x)+sp);
      addEff(target,{...spell.eff});
      log.push(`${spell.icon} ${L} ${spell.name}! ${res.damage} dano + controle.`);
      break;
  }
}

// ── Resolve action ───────────────────────
function resolveAction(atk, def, log) {
  const action=(atk.action||'ataque leve').toLowerCase().trim();
  const L=lbl(atk), res={damage:0,extraDamage:0,heal:0,dodged:false,broken:false};
  if (hasEff(atk,'frozen')||hasEff(atk,'stun')) { log.push(`🚫 ${L} impedido de agir!`); return res; }
  const en=getEnr(atk), wk=getWkn(atk), db=atk.dmgBonus||0;
  switch (action) {
    case 'ataque leve':
      res.damage=Math.max(0,rand(8,15)+en-wk+db);
      log.push(`⚔️ ${L} Ataque Leve! ${res.damage} dano`);
      atk.ultimate=clamp((atk.ultimate||0)+8,0,100); break;
    case 'ataque pesado':
      if ((atk.energy||0)<15) { res.damage=rand(8,15); log.push(`💢 ${L} sem energia → Ataque Leve`); }
      else { atk.energy-=15; res.damage=Math.max(0,rand(20,32)+en-wk+db); log.push(`💢 ${L} Ataque Pesado! ${res.damage} dano`); atk.ultimate=clamp((atk.ultimate||0)+12,0,100); }
      break;
    case 'defesa':
      atk.defending=true; log.push(`🛡️ ${L} Defesa!`); atk.ultimate=clamp((atk.ultimate||0)+5,0,100); break;
    case 'esquiva':
      if (hasEff(atk,'chained')) log.push(`⛓️ ${L} acorrentado, não pode esquivar!`);
      else if (chance(40+(atk.dodgeBonus||0))) { atk.defending=true; res.dodged=true; log.push(`💨 ${L} esquivou!`); atk.ultimate=clamp((atk.ultimate||0)+10,0,100); }
      else log.push(`💨 ${L} tentou esquivar mas falhou!`);
      break;
    case 'contra-ataque':
      if ((atk.energy||0)<20) { res.damage=rand(8,15); log.push(`↩️ ${L} sem energia → Ataque Leve`); }
      else { atk.energy-=20; atk.defending=true; res.damage=Math.max(0,rand(12,20)+en+db); log.push(`↩️ ${L} Contra-Ataque! Prepara ${res.damage}`); atk.ultimate=clamp((atk.ultimate||0)+15,0,100); }
      break;
    case 'break guard':
      if ((atk.energy||0)<25) { res.damage=rand(8,15); log.push(`🔨 ${L} sem energia → Ataque Leve`); }
      else { atk.energy-=25; res.damage=Math.max(0,rand(10,18)+db); res.broken=true; log.push(`🔨 ${L} Break Guard! ${res.damage} dano`); atk.ultimate=clamp((atk.ultimate||0)+12,0,100); }
      break;
    case 'focus': {
      const mg=rand(15,25), eg=rand(10,18);
      atk.mana  =clamp((atk.mana||0)+mg,  0,atk.maxMana);
      atk.energy=clamp((atk.energy||0)+eg, 0,atk.maxEnergy);
      atk.ultimate=clamp((atk.ultimate||0)+8,0,100);
      log.push(`🧘 ${L} Focus! +${mg} mana, +${eg} energia`); break;
    }
    case 'usar item':
      if ((atk.potions||0)<=0) { res.damage=rand(8,15); log.push(`🧪 ${L} sem poções → Ataque Leve`); }
      else { atk.potions--; const h=rand(30,45); atk.hp=clamp(atk.hp+h,0,atk.maxHp); res.heal=h; log.push(`🧪 ${L} Poção! +${h} HP → ${atk.hp}/${atk.maxHp}`); atk.ultimate=clamp((atk.ultimate||0)+5,0,100); }
      break;
    case 'ultimate':
      if ((atk.ultimate||0)<100) { res.damage=rand(8,15); log.push(`✨ ${L} Ultimate não carregado (${atk.ultimate||0}/100) → Ataque Leve`); }
      else { const ud=Math.max(0,rand(45,65+(atk.ultimatePowerBonus||0))+en+db); atk.ultimate=0; res.damage=ud; res.broken=true; log.push(`✨ ${L} ULTIMATE! ${ud} dano massivo!`); }
      break;
    default:
      if (action.startsWith('magia:')) {
        const sid=action.replace('magia:','').trim().replace(/\s+/g,'_');
        resolveSpell(atk,def,sid,res,log);
      } else { res.damage=rand(8,15); log.push(`❓ ${L} confuso → Ataque Leve`); }
  }
  res.damage=Math.max(0,res.damage||0);
  return res;
}

// ── Apply damage ─────────────────────────
function applyDamage(target, ar, log) {
  if (!ar) return;
  const L=lbl(target);
  let total=(ar.damage||0)+(ar.extraDamage||0);
  if (total<=0) return;
  if (ar.broken) { log.push(`💢 ${L} recebe ${total} dano (defesa ignorada)!`); target.hp-=total; return; }
  if (hasEff(target,'shielded')) {
    const sh=(target.effects||[]).find(e=>e.type==='shielded');
    total=Math.floor(total*(1-(sh?.reduction||.5)));
    log.push(`🛡️ ${L} absorveu com Escudo! (${total} dano)`);
    target.hp-=total; return;
  }
  if (target.defending) { total=Math.floor(total*.5); log.push(`🛡️ ${L} defendeu! (${total} dano)`); }
  else if ((target.damageReduction||0)>0) { const r=Math.floor(total*(1-target.damageReduction)); log.push(`🌑 ${L} absorve pela relíquia! (${total}→${r})`); total=r; }
  else log.push(`💢 ${L} recebe ${total} dano!`);
  target.hp-=total;
}

// ── Resolve round ────────────────────────
function resolveRound(p1, p2) {
  const log=[];
  log.push(...applyEffects(p1));
  log.push(...applyEffects(p2));
  const r1=resolveAction(p1,p2,log);
  const r2=resolveAction(p2,p1,log);
  applyDamage(p1,r2,log);
  applyDamage(p2,r1,log);
  p1.action=null; p1.defending=false;
  p2.action=null; p2.defending=false;
  p1.hp=clamp(p1.hp,0,p1.maxHp); p2.hp=clamp(p2.hp,0,p2.maxHp);
  p1.mana=clamp(p1.mana,0,p1.maxMana); p2.mana=clamp(p2.mana,0,p2.maxMana);
  p1.energy=clamp(p1.energy,0,p1.maxEnergy); p2.energy=clamp(p2.energy,0,p2.maxEnergy);
  return log;
}

// ── Sentinel AI ──────────────────────────
function botAction(bot, enemy, diff) {
  if (diff==='easy') {
    if (chance(30)) return 'ataque leve';
    return ['ataque leve','defesa','esquiva','focus','usar item'][rand(0,4)];
  }
  if (diff==='medium') {
    if (bot.hp<40 && bot.potions>0) return 'usar item';
    if (bot.hp<50 && bot.mana>=20 && !(bot.spellCooldowns?.cura>0)) return 'magia: cura';
    if (enemy.hp<30) return 'ataque pesado';
    if (chance(25)) return 'defesa';
    if ((bot.energy||0)<10) return 'focus';
    return ['ataque leve','ataque pesado','esquiva'][rand(0,2)];
  }
  // hard / ai
  if (bot.hp<30 && bot.potions>0) return 'usar item';
  if (bot.hp<40 && bot.mana>=20 && !(bot.spellCooldowns?.cura>0)) return 'magia: cura';
  if ((bot.ultimate||0)>=100) return 'ultimate';
  if (enemy.hp<25) return 'ataque pesado';
  if (!hasEff(enemy,'burning')  && bot.mana>=25 && !(bot.spellCooldowns?.bola_de_fogo>0)) return 'magia: bola_de_fogo';
  if (!hasEff(enemy,'poisoned') && bot.mana>=15 && !(bot.spellCooldowns?.veneno>0))       return 'magia: veneno';
  if (!hasEff(bot,'enraged')    && bot.mana>=20 && !(bot.spellCooldowns?.furia>0))        return 'magia: furia';
  if (enemy.defending && (bot.energy||0)>=25) return 'break guard';
  if ((bot.energy||0)<15 || bot.mana<20) return 'focus';
  return chance(50)?'ataque pesado':'ataque leve';
}

// ── Render ───────────────────────────────
function renderFighter(pre, p) {
  const hpPct   = (Math.max(0,p.hp)/p.maxHp*100).toFixed(1);
  const manaPct = (Math.max(0,p.mana)/p.maxMana*100).toFixed(1);
  el(`${pre}hpbar`).style.width  = hpPct+'%';
  el(`${pre}hptxt`).textContent  = `${Math.max(0,p.hp)}/${p.maxHp}`;
  el(`${pre}manabar`).style.width= manaPct+'%';
  el(`${pre}manatxt`).textContent= `${Math.max(0,p.mana)}/${p.maxMana}`;
  el(`${pre}energy`).textContent = `⚡ ${Math.max(0,p.energy||0)}/${p.maxEnergy||50}`;
  el(`${pre}potions`).textContent= `🧪 ${p.potions||0}`;
  const u=`${Math.min(100,p.ultimate||0)}/100`;
  el(`${pre}ult`).textContent    = `✨ ${u}`;
  if (el(`${pre}ulttxt`)) el(`${pre}ulttxt`).textContent = u;
  if (el(`${pre}ultbar`)) el(`${pre}ultbar`).style.width = Math.min(100,p.ultimate||0)+'%';
  const efxStr=(p.effects||[]).filter(e=>e.rounds>0).map(e=>e.type).join(', ');
  el(`${pre}efx`).textContent=efxStr?`🌀 ${efxStr}`:'';
}

function renderLog(logArr) {
  if (!logArr?.length) return;
  const logEl=el('log');
  logEl.innerHTML=logArr.slice(-40).map((l,i,a)=>{
    if (l.startsWith('━')) return `<p class="sep">${esc(l)}</p>`;
    return `<p>${esc(l)}</p>`;
  }).join('');
  logEl.scrollTop=logEl.scrollHeight;
}

function render() {
  const r=room;
  if (!r) return;
  el('screen-loading').classList.add('hidden');

  if (r.phase==='ended') { renderEnd(r); return; }

  el('screen-battle').classList.remove('hidden');
  el('screen-end').classList.add('hidden');

  const me=r[PLAYER], enemy=r[ENEMY];
  el('rbadge').textContent = `Round ${r.round||1}`;
  el('rid').textContent    = ROOM_ID;
  el('ename').textContent  = enemy?.isBot ? '🤖 Sentinel' : `👤 Oponente`;
  if (me)    renderFighter('my',me);
  if (enemy) renderFighter('e', enemy);
  renderLog(r.log);

  const myAct=r[`${PLAYER}Action`];
  const acted = myAct!==null && myAct!==undefined;
  el('agrid').classList.toggle('hidden', acted || !!r.resolving);
  el('waitmsg').classList.toggle('hidden', !acted && !r.resolving);
  if (acted)       el('waitmsg').textContent = r.isVsBot ? `⚙️ ${myAct} — resolvendo...` : `⏳ ${myAct} — aguardando oponente...`;
  if (r.resolving) el('waitmsg').textContent = '⚙️ Resolvendo round...';
  if (!acted && !r.resolving) actionSent=false;
}

function renderEnd(r) {
  el('screen-battle').classList.add('hidden');
  el('screen-end').classList.remove('hidden');
  const me=r[PLAYER];
  if (r.winner==='draw') {
    el('end-emoji').textContent='🤝'; el('end-ttl').textContent='EMPATE!';
    el('end-stats').innerHTML='Ambos caíram ao mesmo tempo!';
  } else if (r.winner===PLAYER) {
    el('end-emoji').textContent='🏆'; el('end-ttl').textContent='VITÓRIA!';
    el('end-stats').innerHTML=`❤️ HP restante: ${Math.max(0,me?.hp||0)}/${me?.maxHp||120}<br>🎉 +100 XP`;
  } else {
    el('end-emoji').textContent='💀'; el('end-ttl').textContent='DERROTA';
    el('end-stats').innerHTML='Você foi derrotado.<br>+25 XP de participação.';
  }
  const endLog=el('end-log');
  if (r.log?.length) endLog.innerHTML=r.log.slice(-50).map(l=>`<p>${esc(l)}</p>`).join('');
}

// ── Spells panel ─────────────────────────
window.showSpells = () => {
  const me=room?.[PLAYER];
  if (!me) return;
  const grid=el('sgrid');
  grid.innerHTML='';
  for (const id of SLIST) {
    const spell=SP[id];
    const cost=Math.max(0,spell.cost-(me.manaCostReduction||0));
    const onCD=((me.spellCooldowns||{})[id]||0)>0;
    const noMana=(me.mana||0)<cost;
    const div=document.createElement('div');
    div.className=`scard${onCD?' cd':''}${(!onCD&&noMana)?' nm':''}`;
    div.innerHTML=`<div class="sicon">${spell.icon}</div><div class="sname">${spell.name}</div><div class="sdesc">${spell.desc}</div><div class="scost">🔵 ${cost}${onCD?` (CD: ${(me.spellCooldowns||{})[id]}r)`:''}</div>`;
    if (!onCD && !noMana) div.onclick=()=>{ act(`magia: ${id}`); hideSpells(); };
    grid.appendChild(div);
  }
  el('soverlay').classList.remove('hidden');
};
window.hideSpells = (e) => {
  if (!e || e.target===el('soverlay')) el('soverlay').classList.add('hidden');
};

// ── Submit action ─────────────────────────
window.act = async (action) => {
  if (actionSent) return;
  const r=room;
  if (!r || r.phase!=='fighting') return;
  const f=`${PLAYER}Action`;
  if (r[f]!==null && r[f]!==undefined) return;
  actionSent=true;
  const upd={[f]: action};
  if (r.isVsBot) upd.p2Action = botAction(r.p2, r.p1, r.difficulty);
  await updateDoc(roomRef, upd);
};

// ── Round resolution (p1 only in PvP) ─────
async function resolveNow(r) {
  if (resolving) return;
  resolving=true;
  try {
    await updateDoc(roomRef, {resolving:true});
    const p1=JSON.parse(JSON.stringify(r.p1));
    const p2=JSON.parse(JSON.stringify(r.p2));
    p1.action=r.p1Action; p2.action=r.p2Action;
    const rlog=resolveRound(p1,p2);
    const dead1=p1.hp<=0, dead2=p2.hp<=0, ended=dead1||dead2;
    const newLog=[...(r.log||[]), `━━ Round ${r.round||1} ━━`, ...rlog].slice(-60);
    const upd={p1,p2,p1Action:null,p2Action:null,resolving:false,log:newLog};
    if (ended) { upd.phase='ended'; upd.winner=(dead1&&dead2)?'draw':(dead2?'p1':'p2'); }
    else        { upd.phase='fighting'; upd.round=(r.round||1)+1; }
    await updateDoc(roomRef, upd);
  } catch(err) {
    console.error(err);
    await updateDoc(roomRef,{resolving:false}).catch(()=>{});
  } finally { resolving=false; }
}

// ── Firestore listener ────────────────────
onSnapshot(roomRef, snap => {
  if (!snap.exists()) {
    el('screen-loading').innerHTML='<div style="padding:40px;text-align:center;color:#ef4444">⚠️ Sala não encontrada ou expirada.</div>';
    return;
  }
  room=snap.data();
  if (
    room.phase==='fighting' && !room.resolving &&
    room.p1Action!==null && room.p1Action!==undefined &&
    room.p2Action!==null && room.p2Action!==undefined &&
    (PLAYER==='p1' || room.isVsBot)
  ) resolveNow(room);
  render();
});
</script>
