<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>⚔️ Duel Arena 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
canvas{display:block;touch-action:none}
#lobby{position:fixed;inset:0;background:linear-gradient(135deg,#0d0d1a 0%,#1a0d2e 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;z-index:100;padding:10px 15px 80px;gap:12px}
#lobby h1{font-size:clamp(20px,6vw,32px);color:#f59e0b;text-shadow:0 0 20px #f59e0b88;letter-spacing:2px;margin:5px 0}
#lobby h2{font-size:clamp(12px,3vw,16px);color:#7c3aed;margin:-5px 0 10px}
.lcard{background:#151528;border:1px solid #252548;border-radius:12px;padding:10px;width:100%;max-width:min(460px,calc(100vw - 30px));flex-shrink:0}
.lcard h3{font-size:13px;color:#94a3b8;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
#nick-input{width:100%;background:#0d0d1a;border:1px solid #7c3aed;border-radius:8px;color:#e2e8f0;padding:10px 14px;font-size:15px;outline:none}
#nick-input:focus{border-color:#f59e0b}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;max-width:100%}
.cchar{background:#0d0d1a;border:2px solid #252548;border-radius:10px;padding:6px 3px;cursor:pointer;text-align:center;transition:all .15s;min-height:80px}
.cchar:active{transform:scale(.93)}
.cchar.selected{border-color:#f59e0b;background:#1a1500}
.cchar canvas{width:100%;height:auto;display:block;margin:0 auto}
.cchar span{font-size:10px;color:#94a3b8;display:block;margin-top:4px}
.skins{display:flex;gap:8px;flex-wrap:wrap}
.cskin{width:30px;height:30px;border-radius:50%;border:2px solid #252548;cursor:pointer;transition:transform .15s;flex-shrink:0}
.cskin:active{transform:scale(.88)}
.cskin.selected{border-color:#f59e0b;transform:scale(1.15)}
#ready-btn{width:100%;max-width:min(460px,calc(100vw - 30px));padding:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:opacity .15s;margin-top:5px}
#ready-btn:active{opacity:.8}
#ready-btn.waiting{background:#1e3a8a;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#status-msg{font-size:11px;color:#64748b;text-align:center;padding:8px;margin-bottom:20px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 10px;z-index:10;pointer-events:none}
.hud-side{display:flex;flex-direction:column;gap:3px;min-width:120px}
.hud-side.right{align-items:flex-end}
.hud-name{font-size:11px;font-weight:700;color:#e2e8f0;text-shadow:1px 1px 2px #000}
.hud-bar-bg{height:10px;background:#1e1e38;border-radius:5px;overflow:hidden;width:130px}
.hud-bar-fill{height:100%;border-radius:5px;transition:width .1s linear}
.hp-fill{background:linear-gradient(90deg,#7f1d1d,#ef4444)}
.ult-fill{background:linear-gradient(90deg,#78350f,#f59e0b)}
.hud-vals{font-size:9px;color:#94a3b8}
#round-badge{background:#7c3aed;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;align-self:center}
#timer-badge{font-size:13px;font-weight:700;color:#f59e0b;text-align:center;text-shadow:0 0 8px #f59e0b}
#controls{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 10px 12px;z-index:10;pointer-events:none}
#left-controls,#right-controls{pointer-events:all;display:flex;gap:8px;align-items:flex-end}
#joystick-zone{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);position:relative;display:flex;align-items:center;justify-content:center}
#joystick-knob{width:44px;height:44px;border-radius:50%;background:rgba(124,58,237,.7);border:2px solid #7c3aed;position:absolute;pointer-events:none}
#btn-jump{width:54px;height:54px;border-radius:50%;background:rgba(16,185,129,.25);border:2px solid #10b981;color:#10b981;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.abtn{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;border:2px solid;flex-direction:column;line-height:1.2;text-align:center}
.abtn:active{transform:scale(.88);opacity:.7}
#btn-light{background:rgba(239,68,68,.2);border-color:#ef4444;color:#ef4444}
#btn-heavy{background:rgba(245,158,11,.2);border-color:#f59e0b;color:#f59e0b}
#btn-block{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#3b82f6}
#btn-ult{background:rgba(168,85,247,.2);border-color:#a855f7;color:#a855f7}
#btn-special{background:rgba(20,184,166,.2);border-color:#14b8a6;color:#14b8a6;width:46px;height:46px;font-size:10px}
#end-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:12px}
#end-overlay.hidden{display:none}
#end-icon{font-size:56px}
#end-title{font-size:28px;font-weight:800;color:#f59e0b;text-shadow:0 0 20px #f59e0b}
#end-sub{font-size:14px;color:#94a3b8}
#end-xp{font-size:16px;font-weight:700;color:#10b981}
#btn-rematch{padding:12px 32px;background:#7c3aed;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
#btn-rematch:active{opacity:.7}
#hit-texts{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.hit-text{position:absolute;font-weight:800;pointer-events:none;animation:hitFloat .7s ease-out forwards;text-shadow:2px 2px 4px #000}
@keyframes hitFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
#effect-bar{position:fixed;top:52px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;pointer-events:none}
.efx-badge{background:#151528;border:1px solid #252548;border-radius:20px;padding:2px 8px;font-size:10px;color:#f59e0b}
#reconn{position:fixed;top:0;left:0;right:0;background:#7c3aed;color:#fff;text-align:center;padding:6px;font-size:11px;font-weight:700;z-index:300;display:none}
#rotate-hint{position:fixed;inset:0;background:#000;z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;text-align:center;padding:20px}
#rotate-hint span{font-size:48px}
</style>
</head>
<body>
<div id="rotate-hint"><span>📱</span><p>Gire o dispositivo para o modo <strong>paisagem</strong> para jogar!</p></div>
<div id="reconn">🔄 Reconectando...</div>

<div id="lobby">
  <h1>⚔️ DUEL ARENA</h1><h2>2D FIGHTER</h2>
  <div class="lcard"><h3>👤 Seu Nickname</h3>
    <input id="nick-input" type="text" maxlength="16" placeholder="Digite seu nome..." autocomplete="off">
  </div>
  <div class="lcard"><h3>🥷 Escolha seu Personagem</h3><div class="chars" id="char-select"></div></div>
  <div class="lcard" id="skin-card"><h3>🎨 Cor / Skin</h3><div class="skins" id="skin-select"></div></div>
  <button id="ready-btn">⚔️ PRONTO PARA DUELAR</button>
  <div id="status-msg">Aguardando conexão...</div>
</div>

<canvas id="gc" style="display:none"></canvas>

<div id="hud" style="display:none">
  <div class="hud-side left">
    <div class="hud-name" id="hud-p1-name">P1</div>
    <div class="hud-bar-bg"><div class="hud-bar-fill hp-fill"  id="hud-p1-hp"  style="width:100%"></div></div>
    <div class="hud-bar-bg"><div class="hud-bar-fill ult-fill" id="hud-p1-ult" style="width:0%"></div></div>
    <div class="hud-vals" id="hud-p1-vals">HP: 120 | Ult: 0</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
    <div id="round-badge">Round 1</div>
    <div id="timer-badge">60</div>
  </div>
  <div class="hud-side right">
    <div class="hud-name" id="hud-p2-name">P2</div>
    <div class="hud-bar-bg" style="transform:scaleX(-1)"><div class="hud-bar-fill hp-fill"  id="hud-p2-hp"  style="width:100%"></div></div>
    <div class="hud-bar-bg" style="transform:scaleX(-1)"><div class="hud-bar-fill ult-fill" id="hud-p2-ult" style="width:0%"></div></div>
    <div class="hud-vals" id="hud-p2-vals">HP: 120 | Ult: 0</div>
  </div>
</div>
<div id="effect-bar"></div>

<div id="controls" style="display:none">
  <div id="left-controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <button id="btn-jump">↑</button>
  </div>
  <div id="right-controls">
    <button class="abtn" id="btn-special">✦<br>ESP</button>
    <button class="abtn" id="btn-block">🛡<br>DEF</button>
    <button class="abtn" id="btn-heavy">💢<br>FOR</button>
    <button class="abtn" id="btn-light">⚔<br>LVE</button>
    <button class="abtn" id="btn-ult">✨<br>ULT</button>
  </div>
</div>

<div id="hit-texts"></div>

<div id="end-overlay" class="hidden">
  <div id="end-icon">🏆</div>
  <div id="end-title">VITÓRIA!</div>
  <div id="end-sub"></div>
  <div id="end-xp"></div>
  <button id="btn-rematch">🔄 Jogar Novamente</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════
// CONSTANTES
// ═══════════════════════════════════════════════════════
const ARENA_W   = 800;
const ARENA_H   = 450;
const FLOOR_Y   = 340;   // posição Y do chão (arena coords)
const MAX_HP    = 120;
const ROUND_DUR = 60;

const CHARS = [
  { id:'warrior', name:'Guerreiro' },
  { id:'mage',    name:'Mago'      },
  { id:'ninja',   name:'Ninja'     },
  { id:'demon',   name:'Demônio'   },
];
const SKINS = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#e2e8f0'];

// ═══════════════════════════════════════════════════════
// URL PARAMS
// ═══════════════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const ROOM   = params.get('room');
const PSLOT  = params.get('player');
const ENEMY  = PSLOT === 'p1' ? 'p2' : 'p1';

if (!ROOM || !['p1','p2'].includes(PSLOT)) {
  document.body.innerHTML = '<p style="color:red;padding:30px;font-size:16px">⚠️ Link inválido.</p>';
  throw new Error('bad link');
}

// ═══════════════════════════════════════════════════════
// ORIENTAÇÃO
// ═══════════════════════════════════════════════════════
function checkOrientation() {
  document.getElementById('rotate-hint').style.display =
    window.innerWidth < window.innerHeight ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
checkOrientation();

// ═══════════════════════════════════════════════════════
// CANVAS + CACHE DE ESCALA
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d', { alpha: false, desynchronized: true });
ctx.imageSmoothingEnabled = false;

// Cache de transformação — recalculado só no resize
let SC = { scale: 1, offX: 0, offY: 0 };

function recalcScale() {
  const sx = canvas.width  / ARENA_W;
  const sy = canvas.height / ARENA_H;
  SC.scale = Math.min(sx, sy);
  SC.offX  = (canvas.width  - ARENA_W * SC.scale) / 2;
  SC.offY  = (canvas.height - ARENA_H * SC.scale) / 2;
}

function toSX(ax) { return SC.offX + ax * SC.scale; }
function toSY(ay) { return SC.offY + ay * SC.scale; }

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  recalcScale();
  rebuildCache(); // recria gradientes em cache
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ═══════════════════════════════════════════════════════
// CACHE DE GRADIENTES — criados 1x, reutilizados sempre
// PRINCIPAL causa dos 3 FPS: gradientes criados a cada frame
// ═══════════════════════════════════════════════════════
let bgGrad      = null;   // fundo
let floorGrad   = null;   // chão
let torchGlow1  = null;   // glow tocha esq
let torchGlow2  = null;   // glow tocha dir
let bgCanvas    = null;   // fundo pré-renderizado (offscreen)

function rebuildCache() {
  const W = canvas.width;
  const H = canvas.height;

  // Gradiente do fundo
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0,   '#030712');
  bgGrad.addColorStop(0.5, '#0d0d1a');
  bgGrad.addColorStop(1,   '#0d1a0d');

  // Gradiente do chão
  const fy = toSY(FLOOR_Y);
  floorGrad = ctx.createLinearGradient(0, fy, 0, fy + 30 * SC.scale);
  floorGrad.addColorStop(0, '#1e3a1e');
  floorGrad.addColorStop(1, '#0d1a0d');

  // Glow das tochas (radial, estático — só posição muda)
  const tx1 = toSX(60),         ty1 = toSY(FLOOR_Y - 30);
  const tx2 = toSX(ARENA_W-60), ty2 = toSY(FLOOR_Y - 30);
  torchGlow1 = ctx.createRadialGradient(tx1, ty1, 0, tx1, ty1, 40 * SC.scale);
  torchGlow1.addColorStop(0, 'rgba(245,158,11,0.22)');
  torchGlow1.addColorStop(1, 'rgba(245,158,11,0)');
  torchGlow2 = ctx.createRadialGradient(tx2, ty2, 0, tx2, ty2, 40 * SC.scale);
  torchGlow2.addColorStop(0, 'rgba(245,158,11,0.22)');
  torchGlow2.addColorStop(1, 'rgba(245,158,11,0)');

  // Fundo estático pré-renderizado num OffscreenCanvas (estrelas, plataforma)
  // Evita redesenhar elementos que nunca mudam
  bgCanvas = document.createElement('canvas');
  bgCanvas.width  = W;
  bgCanvas.height = H;
  const bc = bgCanvas.getContext('2d', { alpha: false });
  bc.imageSmoothingEnabled = false;

  // Fundo
  bc.fillStyle = bgGrad; // reutiliza o mesmo gradiente
  // Reconstrói o gradiente no contexto do bgCanvas
  const bg2 = bc.createLinearGradient(0, 0, 0, H);
  bg2.addColorStop(0,   '#030712');
  bg2.addColorStop(0.5, '#0d0d1a');
  bg2.addColorStop(1,   '#0d1a0d');
  bc.fillStyle = bg2;
  bc.fillRect(0, 0, W, H);

  // Estrelas estáticas
  bc.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 25; i++) {
    const sx = (i * 137.508 * W) % W;
    const sy = (i * 97.3   * H / 2) % (H * 0.55);
    bc.beginPath();
    bc.arc(sx, sy, i % 3 === 0 ? 1.5 : 0.8, 0, Math.PI * 2);
    bc.fill();
  }

  // Glow tochas (estático — só a chama anima)
  bc.globalAlpha = 0.6;
  bc.fillStyle   = bc.createRadialGradient(tx1, ty1, 0, tx1, ty1, 40 * SC.scale);
  bc.fillStyle.constructor; // workaround — recria no bgCanvas
  const tg1b = bc.createRadialGradient(tx1, ty1, 0, tx1, ty1, 40 * SC.scale);
  tg1b.addColorStop(0, 'rgba(245,158,11,0.22)'); tg1b.addColorStop(1, 'rgba(245,158,11,0)');
  const tg2b = bc.createRadialGradient(tx2, ty2, 0, tx2, ty2, 40 * SC.scale);
  tg2b.addColorStop(0, 'rgba(245,158,11,0.22)'); tg2b.addColorStop(1, 'rgba(245,158,11,0)');
  bc.fillStyle = tg1b;
  bc.beginPath(); bc.arc(tx1, ty1, 40 * SC.scale, 0, Math.PI * 2); bc.fill();
  bc.fillStyle = tg2b;
  bc.beginPath(); bc.arc(tx2, ty2, 40 * SC.scale, 0, Math.PI * 2); bc.fill();
  bc.globalAlpha = 1;

  // Postes das tochas
  bc.fillStyle = '#92400e';
  bc.fillRect(tx1 - 3*SC.scale, ty1, 6*SC.scale, 20*SC.scale);
  bc.fillRect(tx2 - 3*SC.scale, ty2, 6*SC.scale, 20*SC.scale);

  // Plataforma central
  const px = toSX(ARENA_W/2 - 60), py = toSY(FLOOR_Y - 8);
  bc.fillStyle   = '#1e293b';
  bc.fillRect(px, py, 120 * SC.scale, 10 * SC.scale);
  bc.strokeStyle = '#334155'; bc.lineWidth = 1;
  bc.strokeRect(px, py, 120 * SC.scale, 10 * SC.scale);
}

// ═══════════════════════════════════════════════════════
// SPRITES
// ═══════════════════════════════════════════════════════
function shadeColor(hex, amt) {
  try {
    const r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3),16)+amt));
    const g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5),16)+amt));
    const b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7),16)+amt));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  } catch(e) { return hex; }
}

// Cache de cores por skin (evita shadeColor a cada frame)
const skinCache = new Map();
function getSkinColors(skin) {
  if (!skinCache.has(skin)) {
    skinCache.set(skin, { c: skin, dark: shadeColor(skin,-40), lite: shadeColor(skin,+50) });
  }
  return skinCache.get(skin);
}

function drawCharacterSprite(ctx2, charId, skin, x, y, scale, flipped, state, frame) {
  const { c, dark, lite } = getSkinColors(skin);
  ctx2.save();
  if (flipped) { ctx2.translate(x + 24*scale, y); ctx2.scale(-1, 1); x = 0; }
  else           ctx2.translate(x, y);
  ctx2.scale(scale, scale);
  const by = state === 'walk' ? Math.sin(frame * 0.4) * 2 : 0;
  const ax = state === 'attack' ? Math.sin(frame * 1.2) * 3 : 0;
  switch (charId) {
    case 'mage':  drawMage(ctx2,c,dark,lite,by,ax,state);  break;
    case 'ninja': drawNinja(ctx2,c,dark,lite,by,ax,state); break;
    case 'demon': drawDemon(ctx2,c,dark,lite,by,ax,state); break;
    default:      drawWarrior(ctx2,c,dark,lite,by,ax,state);
  }
  ctx2.restore();
}

function drawWarrior(c2,c,d,l,by,ax,st) {
  const isAtk = st==='attack';
  c2.fillStyle=d; c2.fillRect(6,30+by,7,14); c2.fillRect(15,30+by,7,14);
  c2.fillStyle=c; c2.fillRect(4,16+by,20,16);
  c2.fillStyle=l; c2.fillRect(7,18+by,14,10);
  c2.fillStyle='#d4a96a'; c2.fillRect(7,4+by,14,12);
  c2.fillStyle=c; c2.fillRect(5,2+by,18,7); c2.fillRect(5,7+by,3,5); c2.fillRect(20,7+by,3,5);
  c2.fillStyle='#fff'; c2.fillRect(8,5+by,3,3); c2.fillRect(15,5+by,3,3);
  c2.fillStyle='#000'; c2.fillRect(9,6+by,2,2); c2.fillRect(16,6+by,2,2);
  c2.fillStyle='#94a3b8';
  c2.fillRect(22+(isAtk?ax:0), isAtk?14+by:18+by, 3, isAtk?20:16);
  c2.fillStyle='#f59e0b';
  c2.fillRect(19+(isAtk?ax:0), isAtk?22+by:24+by, 9, 3);
  c2.fillStyle=d; c2.fillRect(-4,16+by,6,12);
  c2.fillStyle=l; c2.fillRect(-3,18+by,4,8);
}
function drawMage(c2,c,d,l,by,ax,st) {
  const isAtk = st==='attack';
  c2.fillStyle=c; c2.beginPath(); c2.moveTo(4,16+by); c2.lineTo(24,16+by); c2.lineTo(26,44+by); c2.lineTo(2,44+by); c2.closePath(); c2.fill();
  c2.fillStyle=l; c2.fillRect(10,17+by,8,14);
  c2.fillStyle='#d4a96a'; c2.fillRect(7,6+by,14,11);
  c2.fillStyle=d; c2.beginPath(); c2.moveTo(14,-2+by); c2.lineTo(22,10+by); c2.lineTo(5,10+by); c2.closePath(); c2.fill(); c2.fillRect(3,9+by,22,4);
  c2.fillStyle='#fff'; c2.fillRect(9,9+by,3,3); c2.fillRect(16,9+by,3,3);
  c2.fillStyle='#60a5fa'; c2.fillRect(10,10+by,2,2); c2.fillRect(17,10+by,2,2);
  const cx=isAtk?24+ax:24, cy=isAtk?2+by:4+by;
  c2.fillStyle='#a16207'; c2.fillRect(cx,cy,4,32);
  c2.fillStyle='#7c3aed'; c2.beginPath(); c2.arc(cx+2,cy-2,isAtk?6:5,0,Math.PI*2); c2.fill();
  if(isAtk){c2.fillStyle='#fff';c2.beginPath();c2.arc(cx+2,cy-2,3,0,Math.PI*2);c2.fill();}
}
function drawNinja(c2,c,d,l,by,ax,st) {
  const isAtk = st==='attack';
  c2.fillStyle=d; c2.fillRect(6,30+by,7,14); c2.fillRect(15,30+by,7,14);
  c2.fillStyle=c; c2.fillRect(5,14+by,18,17);
  c2.fillStyle=l; c2.fillRect(5,27+by,18,4);
  c2.fillStyle='#d4a96a'; c2.fillRect(7,6+by,14,12);
  c2.fillStyle=d; c2.fillRect(5,2+by,18,5); c2.fillRect(5,11+by,18,6);
  c2.fillStyle=c; c2.fillRect(5,6+by,18,6);
  c2.fillStyle='#fff'; c2.fillRect(7,7+by,4,4); c2.fillRect(17,7+by,4,4);
  c2.fillStyle='#000'; c2.fillRect(8,8+by,2,2); c2.fillRect(18,8+by,2,2);
  const kx=isAtk?22+ax:22, kw=isAtk?12:8, ky=isAtk?20+by:22+by;
  c2.fillStyle='#94a3b8'; c2.fillRect(kx,ky,kw,3);
  c2.fillStyle='#ef4444'; c2.beginPath(); c2.moveTo(kx+kw,ky-1); c2.lineTo(kx+kw+6,ky+1.5); c2.lineTo(kx+kw,ky+4); c2.closePath(); c2.fill();
}
function drawDemon(c2,c,d,l,by,ax,st) {
  c2.fillStyle=d; c2.fillRect(6,30+by,7,14); c2.fillRect(15,30+by,7,14);
  c2.fillStyle=c; c2.fillRect(4,14+by,20,17);
  const ws=shadeColor(c,-20);
  c2.fillStyle=ws; c2.beginPath(); c2.moveTo(4,16+by); c2.lineTo(-10,10+by); c2.lineTo(4,24+by); c2.closePath(); c2.fill();
  c2.beginPath(); c2.moveTo(24,16+by); c2.lineTo(38,10+by); c2.lineTo(24,24+by); c2.closePath(); c2.fill();
  c2.fillStyle=c; c2.fillRect(6,4+by,16,11);
  c2.fillStyle=l; c2.fillRect(7,-2+by,4,8); c2.fillRect(17,-2+by,4,8);
  c2.fillStyle='#ff0000'; c2.beginPath(); c2.arc(10,8+by,3,0,Math.PI*2); c2.fill(); c2.beginPath(); c2.arc(18,8+by,3,0,Math.PI*2); c2.fill();
  c2.fillStyle='#ffff00'; c2.beginPath(); c2.arc(10,8+by,1.5,0,Math.PI*2); c2.fill(); c2.beginPath(); c2.arc(18,8+by,1.5,0,Math.PI*2); c2.fill();
  if(st==='attack'){c2.fillStyle=l;c2.fillRect(24+ax,16+by,8,6);c2.fillRect(32+ax,13+by,3,4);c2.fillRect(32+ax,17+by,3,4);c2.fillRect(32+ax,21+by,3,4);}
}

// ═══════════════════════════════════════════════════════
// LOBBY
// ═══════════════════════════════════════════════════════
let myChar = 'warrior', mySkin = SKINS[0], myNick = '', myReady = false;

const charSelect = document.getElementById('char-select');
CHARS.forEach(ch => {
  const wrap = document.createElement('div');
  wrap.className = `cchar${ch.id===myChar?' selected':''}`;
  wrap.dataset.id = ch.id;
  const cv = document.createElement('canvas');
  cv.width = 56; cv.height = 56;
  drawCharacterSprite(cv.getContext('2d'), ch.id, SKINS[0], 4, 4, 1.8, false, 'idle', 0);
  const lbl = document.createElement('span');
  lbl.textContent = ch.name;
  wrap.appendChild(cv); wrap.appendChild(lbl);
  wrap.addEventListener('click', () => {
    document.querySelectorAll('.cchar').forEach(e => e.classList.remove('selected'));
    wrap.classList.add('selected'); myChar = ch.id; redrawThumbs();
  });
  charSelect.appendChild(wrap);
});
function redrawThumbs() {
  document.querySelectorAll('.cchar').forEach(w => {
    const cv = w.querySelector('canvas');
    const c2 = cv.getContext('2d');
    c2.clearRect(0,0,cv.width,cv.height);
    drawCharacterSprite(c2, w.dataset.id, w.dataset.id===myChar?mySkin:SKINS[0], 4, 4, 1.8, false, 'idle', 0);
  });
}
const skinSelect = document.getElementById('skin-select');
SKINS.forEach((sk,i) => {
  const btn = document.createElement('div');
  btn.className = `cskin${i===0?' selected':''}`;
  btn.style.background = sk;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cskin').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected'); mySkin = sk; redrawThumbs();
  });
  skinSelect.appendChild(btn);
});
document.getElementById('nick-input').value = localStorage.getItem('duel2d_nick') || '';

document.getElementById('ready-btn').addEventListener('click', () => {
  if (myReady) return;
  const nick = document.getElementById('nick-input').value.trim() || `Player_${PSLOT}`;
  localStorage.setItem('duel2d_nick', nick);
  myNick = nick; myReady = true;
  document.getElementById('ready-btn').textContent = '⏳ Aguardando oponente...';
  document.getElementById('ready-btn').classList.add('waiting');
  document.getElementById('status-msg').textContent = '✅ Pronto! Aguardando oponente...';
  socket.emit('player_ready', { roomId:ROOM, slot:PSLOT, nick, charId:myChar, skin:mySkin });
});

// ═══════════════════════════════════════════════════════
// SOCKET
// ═══════════════════════════════════════════════════════
const socket = io({ reconnectionDelay:1500, reconnectionAttempts:15 });

socket.on('connect', () => {
  document.getElementById('reconn').style.display = 'none';
  document.getElementById('status-msg').textContent = '✅ Conectado! Configure e clique em Pronto.';
  socket.emit('join_2d', { roomId:ROOM, slot:PSLOT });
});
socket.on('disconnect', () => { document.getElementById('reconn').style.display = 'block'; });
socket.on('reconnect', () => {
  document.getElementById('reconn').style.display = 'none';
  socket.emit('join_2d', { roomId:ROOM, slot:PSLOT });
  if (myReady) socket.emit('player_ready', { roomId:ROOM, slot:PSLOT, nick:myNick, charId:myChar, skin:mySkin });
});
socket.on('waiting_opponent', () => { document.getElementById('status-msg').textContent = '⏳ Aguardando oponente...'; });
socket.on('both_ready',  () => { document.getElementById('status-msg').textContent = '🔥 Ambos prontos! Iniciando...'; });
socket.on('game_state',  applyGameState);
socket.on('hit_event',   onHitEvent);
socket.on('round_end',   handleRoundEnd);
socket.on('game_over',   handleGameOver);
socket.on('error_msg',   msg => { document.getElementById('status-msg').textContent = `⚠️ ${msg}`; });

// ═══════════════════════════════════════════════════════
// ESTADO LOCAL
// ═══════════════════════════════════════════════════════
let gameRunning = false;
let animFrame   = null;
let localFrame  = 0;

// Estado interpolado localmente
let gs = {
  p1: { x:150, y:FLOOR_Y, hp:MAX_HP, maxHp:MAX_HP, ult:0, state:'idle', flipped:false, charId:'warrior', skin:SKINS[0], nick:'P1', effects:[], blocking:false, hitFlash:0 },
  p2: { x:620, y:FLOOR_Y, hp:MAX_HP, maxHp:MAX_HP, ult:0, state:'idle', flipped:true,  charId:'ninja',   skin:SKINS[2], nick:'P2', effects:[], blocking:false, hitFlash:0 },
  round:1, timeLeft:ROUND_DUR, phase:'lobby', wins:{p1:0,p2:0},
};

// Controle de throttle do HUD (DOM é caro — atualiza 10x/s máx)
let lastHudUpdate = 0;

function applyGameState(srv) {
  if (!srv) return;
  ['p1','p2'].forEach(slot => {
    const s = srv[slot]; if (!s) return;
    const d = gs[slot];
    // Interpolação de posição (suaviza jitter de rede)
    d.x = d.x + (s.x - d.x) * 0.4;
    d.y = d.y + (s.y - d.y) * 0.4;
    d.hp      = s.hp;
    d.ult     = s.ult;
    d.state   = s.state;
    d.flipped = s.flipped;
    d.effects = s.effects || [];
    d.blocking= s.blocking || false;
    if (s.charId) d.charId = s.charId;
    if (s.skin)   d.skin   = s.skin;
    if (s.nick)   d.nick   = s.nick;
    if (!d.hitFlash) d.hitFlash = 0;
  });
  gs.round    = srv.round    ?? gs.round;
  gs.timeLeft = srv.timeLeft ?? gs.timeLeft;
  gs.phase    = srv.phase    ?? gs.phase;
  gs.wins     = srv.wins     ?? gs.wins;

  // Inicia jogo quando servidor confirmar fase 'fight'
  if (gs.phase === 'fight' && !gameRunning) startGame();

  // HUD throttlado — não atualiza DOM a cada packet de rede
  const now = Date.now();
  if (now - lastHudUpdate > 100) { lastHudUpdate = now; updateHUD(); }
}

// ═══════════════════════════════════════════════════════
// CONTROLES TOUCH
// ═══════════════════════════════════════════════════════
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
let joystickActive = false, joystickId = null, lastMoveSend = 0;

function sendInput(type, data) {
  socket.volatile.emit('player_input', { roomId:ROOM, slot:PSLOT, type, ...(data||{}) });
}

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickActive = true; joystickId = t.identifier;
  updateJoystick(t);
}, { passive:false });
document.addEventListener('touchmove', e => {
  if (!joystickActive) return;
  for (const t of e.changedTouches) if (t.identifier===joystickId) { updateJoystick(t); break; }
}, { passive:false });
document.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier===joystickId) {
      joystickActive = false; joystickId = null;
      joystickKnob.style.transform = 'translate(0,0)';
      sendInput('move', { dx:0 }); break;
    }
  }
});
function updateJoystick(touch) {
  const rect = joystickZone.getBoundingClientRect();
  let dx = touch.clientX - (rect.left + rect.width/2);
  let dy = touch.clientY - (rect.top  + rect.height/2);
  const dist = Math.sqrt(dx*dx+dy*dy), max = rect.width/2 - 8;
  if (dist > max) { dx=dx/dist*max; dy=dy/dist*max; }
  joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;
  const now = Date.now();
  if (now - lastMoveSend >= 40) { lastMoveSend = now; sendInput('move', { dx: dx/max }); }
}

document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); sendInput('jump'); }, { passive:false });
document.getElementById('btn-jump').addEventListener('mousedown',  e => { e.preventDefault(); sendInput('jump'); });
[
  { id:'btn-light',   type:'attack_light' },
  { id:'btn-heavy',   type:'attack_heavy' },
  { id:'btn-block',   type:'block'        },
  { id:'btn-ult',     type:'ultimate'     },
  { id:'btn-special', type:'special'      },
].forEach(({ id, type }) => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); sendInput(type); }, { passive:false });
  btn.addEventListener('mousedown',  e => { e.preventDefault(); sendInput(type); });
});

// ═══════════════════════════════════════════════════════
// INICIAR JOGO
// ═══════════════════════════════════════════════════════
function startGame() {
  if (gameRunning) return;
  gameRunning = true;
  document.getElementById('gc').style.display       = 'block';
  document.getElementById('lobby').style.display    = 'none';
  document.getElementById('hud').style.display      = 'flex';
  document.getElementById('controls').style.display = 'flex';
  updateHUD();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════
// GAME LOOP — rAF puro, sem setInterval paralelo
// ═══════════════════════════════════════════════════════
function gameLoop() {
  if (!gameRunning) return;
  localFrame++;
  render();
  animFrame = requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════
// RENDER — otimizado:
// • drawImage do bgCanvas pré-renderizado (1 draw call)
// • gradientes reutilizados do cache
// • chama toSX/toSY (inline, sem objeto) em vez de toScreen()
// • FIX: chão em toSY(FLOOR_Y), não toSY(FLOOR_Y+44)
// ═══════════════════════════════════════════════════════
function render() {
  const W = canvas.width;
  const H = canvas.height;

  // ── 1. Fundo estático (1 draw call) ──────────────────
  ctx.drawImage(bgCanvas, 0, 0);

  // ── 2. Chamas animadas das tochas (única parte dinâmica do fundo)
  const flicker = Math.sin(localFrame * 0.18) * 3 * SC.scale;
  const tx1 = toSX(60),         ty1 = toSY(FLOOR_Y - 30);
  const tx2 = toSX(ARENA_W-60), ty2 = toSY(FLOOR_Y - 30);
  drawFlame(tx1, ty1, flicker);
  drawFlame(tx2, ty2, flicker);

  // ── 3. Personagens ───────────────────────────────────
  ['p1','p2'].forEach(slot => {
    const p  = gs[slot];
    // FIX: sprite top em (p.x-14, p.y-44) → pés em p.y = FLOOR_Y
    const sx = toSX(p.x - 14);
    const sy = toSY(p.y - 44);
    const ss = SC.scale;

    // Sombra — alinhada ao FLOOR_Y real
    const shadowX = toSX(p.x);
    const shadowY = toSY(FLOOR_Y);   // FIX: era FLOOR_Y+44
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle   = '#000';
    ctx.beginPath();
    ctx.ellipse(shadowX, shadowY, 18*ss, 5*ss, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Hit flash
    if (p.hitFlash > 0) {
      ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff';
      ctx.fillRect(sx - 5*ss, sy, 38*ss, 50*ss);
      ctx.restore();
      p.hitFlash--;
    }

    drawCharacterSprite(ctx, p.charId, p.skin, sx, sy, ss, p.flipped, p.state, localFrame);

    // Escudo
    if (p.blocking) {
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.ellipse(sx + 14*ss, sy + 22*ss, 22*ss, 28*ss, 0, 0, Math.PI*2);
      ctx.fill(); ctx.restore();
    }

    // Nick
    ctx.fillStyle   = '#e2e8f0';
    ctx.font        = `bold ${Math.floor(11*ss)}px system-ui`;
    ctx.textAlign   = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
    ctx.fillText(p.nick, toSX(p.x), toSY(p.y - 56));
    ctx.shadowBlur  = 0;
  });

  // ── 4. Chão — FIX: toSY(FLOOR_Y), não toSY(FLOOR_Y+44)
  const fy = toSY(FLOOR_Y);
  ctx.fillStyle = floorGrad;   // gradiente do cache
  ctx.fillRect(0, fy, W, H - fy);
  ctx.strokeStyle = '#22c55e44'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
}

// Chama animada — desenhada por cima do bgCanvas a cada frame
function drawFlame(x, y, flicker) {
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle   = '#f59e0b';
  ctx.beginPath();
  ctx.moveTo(x, y - 10*SC.scale);
  ctx.lineTo(x - 7*SC.scale, y + flicker);
  ctx.lineTo(x + 7*SC.scale, y + flicker);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle   = '#fde68a';
  ctx.beginPath();
  ctx.moveTo(x, y - 14*SC.scale);
  ctx.lineTo(x - 4*SC.scale, y + flicker);
  ctx.lineTo(x + 4*SC.scale, y + flicker);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// HUD — throttlado, atualiza apenas o que mudou
// ═══════════════════════════════════════════════════════
let prevHud = {};
function updateHUD() {
  const p1 = gs.p1, p2 = gs.p2;
  const p1hp  = `${(p1.hp / (p1.maxHp||MAX_HP) * 100).toFixed(1)}%`;
  const p2hp  = `${(p2.hp / (p2.maxHp||MAX_HP) * 100).toFixed(1)}%`;
  const p1ult = `${Math.min(100, p1.ult)}%`;
  const p2ult = `${Math.min(100, p2.ult)}%`;
  const timer = `${Math.ceil(gs.timeLeft||0)}`;
  const ultOp = p1.ult >= 100 ? '1' : '0.4';

  // Só atualiza DOM se valor mudou
  if (p1hp  !== prevHud.p1hp)  { document.getElementById('hud-p1-hp').style.width  = p1hp;  prevHud.p1hp  = p1hp; }
  if (p2hp  !== prevHud.p2hp)  { document.getElementById('hud-p2-hp').style.width  = p2hp;  prevHud.p2hp  = p2hp; }
  if (p1ult !== prevHud.p1ult) { document.getElementById('hud-p1-ult').style.width = p1ult; prevHud.p1ult = p1ult; }
  if (p2ult !== prevHud.p2ult) { document.getElementById('hud-p2-ult').style.width = p2ult; prevHud.p2ult = p2ult; }
  if (p1.nick !== prevHud.p1n) { document.getElementById('hud-p1-name').textContent = p1.nick; prevHud.p1n = p1.nick; }
  if (p2.nick !== prevHud.p2n) { document.getElementById('hud-p2-name').textContent = p2.nick; prevHud.p2n = p2.nick; }

  const p1v = `HP: ${Math.max(0,p1.hp)} | Ult: ${Math.floor(p1.ult)}`;
  const p2v = `HP: ${Math.max(0,p2.hp)} | Ult: ${Math.floor(p2.ult)}`;
  if (p1v !== prevHud.p1v) { document.getElementById('hud-p1-vals').textContent = p1v; prevHud.p1v = p1v; }
  if (p2v !== prevHud.p2v) { document.getElementById('hud-p2-vals').textContent = p2v; prevHud.p2v = p2v; }
  if (timer !== prevHud.timer) { document.getElementById('timer-badge').textContent = timer; prevHud.timer = timer; }

  const rb = `Round ${gs.round}`;
  if (rb !== prevHud.rb) { document.getElementById('round-badge').textContent = rb; prevHud.rb = rb; }
  if (ultOp !== prevHud.ultOp) { document.getElementById('btn-ult').style.opacity = ultOp; prevHud.ultOp = ultOp; }

  // Efeitos (raro — sem throttle extra)
  const mySlot = gs[PSLOT];
  const efxStr = mySlot?.effects?.length
    ? mySlot.effects.map(e => `<div class="efx-badge">${e}</div>`).join('')
    : '';
  if (efxStr !== prevHud.efx) { document.getElementById('effect-bar').innerHTML = efxStr; prevHud.efx = efxStr; }
}

// ═══════════════════════════════════════════════════════
// HIT TEXT
// ═══════════════════════════════════════════════════════
function spawnHitText(dmg, arenaX, arenaY, isCrit) {
  const div = document.createElement('div');
  div.className = 'hit-text';
  div.textContent = isCrit ? `💥${dmg}!` : `-${dmg}`;
  div.style.cssText = `left:${toSX(arenaX)}px;top:${toSY(arenaY)}px;font-size:${isCrit?'18':'14'}px;color:${isCrit?'#f59e0b':'#ef4444'}`;
  document.getElementById('hit-texts').appendChild(div);
  setTimeout(() => div.remove(), 800);
}
function onHitEvent(ev) {
  const target = ev.target === 'p1' ? gs.p1 : gs.p2;
  if (target) target.hitFlash = 6;
  spawnHitText(ev.dmg, ev.x, ev.y, ev.isCrit);
}

// ═══════════════════════════════════════════════════════
// ROUND END / GAME OVER
// ═══════════════════════════════════════════════════════
function handleRoundEnd(data) {
  const ov = document.getElementById('end-overlay');
  document.getElementById('end-icon').textContent  = data.draw ? '🤝' : data.winner===PSLOT ? '✊' : '💀';
  document.getElementById('end-title').textContent = data.draw ? 'ROUND EMPATE' : `ROUND ${gs.round} ${data.winner===PSLOT?'✓':'✗'}`;
  document.getElementById('end-sub').textContent   = 'Próximo round em 3s...';
  document.getElementById('end-xp').textContent    = '';
  document.getElementById('btn-rematch').style.display = 'none';
  ov.classList.remove('hidden');
  setTimeout(() => ov.classList.add('hidden'), 3000);
}
function handleGameOver(data) {
  gameRunning = false;
  cancelAnimationFrame(animFrame);
  const won = data.winner===PSLOT, draw = data.draw;
  const ov  = document.getElementById('end-overlay');
  document.getElementById('end-icon').textContent  = draw?'🤝':won?'🏆':'💀';
  document.getElementById('end-title').textContent = draw?'EMPATE!':won?'VITÓRIA!':'DERROTA';
  document.getElementById('end-sub').textContent   = draw?'Ambos lutaram com honra!':won?`Você derrotou ${gs[ENEMY].nick}!`:`${gs[ENEMY].nick} venceu!`;
  document.getElementById('end-xp').textContent    = draw?'+20 XP':won?'+100 XP':'-100 XP';
  document.getElementById('btn-rematch').style.display = 'block';
  ov.classList.remove('hidden');
}
document.getElementById('btn-rematch').addEventListener('click', () => location.reload());
</script>
