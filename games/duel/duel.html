<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>⚔️ Duel Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --c1:#7c3aed;--c2:#4f46e5;--gold:#f59e0b;--red:#ef4444;--green:#22c55e;
  --blue:#3b82f6;--bg:#07071a;--card:#0f0f2a;--border:#1e1e48;
  --text:#e2e8f0;--sub:#94a3b8;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif;color:var(--text)}

/* ─── FUNDO ANIMADO ─────────────────────────── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ─── TELAS ──────────────────────────────────── */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity .4s}
.screen.hidden{opacity:0;pointer-events:none}

/* ── Waiting ── */
#screen-wait{gap:20px;text-align:center}
#wait-title{font-size:28px;font-weight:800;color:var(--gold);text-shadow:0 0 20px #f59e0b66}
#wait-sub{font-size:14px;color:var(--sub)}
.spinner{width:72px;height:72px;border:4px solid var(--border);border-top-color:var(--c1);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#wait-swords{font-size:48px;animation:pulse-big 1.5s ease-in-out infinite}
@keyframes pulse-big{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ── Arena ── */
#screen-arena{padding:0;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
#arena-inner{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:0;padding-bottom:20px}

/* ─── TOPO: barras de vida ────────────────────── */
#hud-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border)}
.hud-player{flex:1;display:flex;flex-direction:column;gap:3px}
.hud-player.right{align-items:flex-end}
.hud-name{font-size:11px;font-weight:700;color:var(--gold)}
.bar-wrap{height:12px;background:#1a1a3a;border-radius:6px;overflow:hidden;position:relative}
.bar-hp  {height:100%;border-radius:6px;background:linear-gradient(90deg,#7f1d1d,#ef4444);transition:width .4s}
.bar-mana{height:100%;border-radius:6px;background:linear-gradient(90deg,#1e3a8a,#3b82f6);transition:width .4s}
.bar-energy{height:100%;border-radius:6px;background:linear-gradient(90deg,#78350f,#f59e0b);transition:width .4s}
.hud-bars{display:flex;flex-direction:column;gap:2px;width:100%}
.bar-row{display:flex;gap:4px;align-items:center}
.bar-icon{font-size:9px;width:12px;text-align:center;flex-shrink:0}
.bar-label{font-size:9px;color:var(--sub);min-width:28px}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 8px}
#round-badge{background:var(--c1);padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;color:#fff;white-space:nowrap}
#turn-indicator{font-size:9px;color:var(--sub);text-align:center}
.hud-effects{display:flex;gap:3px;flex-wrap:wrap;max-width:120px}
.eff-chip{font-size:9px;background:#1e1e48;border-radius:10px;padding:1px 5px;color:var(--gold)}

/* ─── ARENA VISUAL ────────────────────────────── */
#arena-canvas-wrap{position:relative;width:100%;height:160px;overflow:hidden;background:#050510}
#arena-canvas{width:100%;height:100%}
#dmg-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg-float{position:absolute;font-weight:800;font-size:16px;pointer-events:none;animation:dmgFloat .9s ease-out forwards}
.dmg-float.crit{font-size:22px;color:var(--gold)}
.dmg-float.heal{color:var(--green)}
.dmg-float.miss{color:var(--sub);font-size:13px}
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}

/* ─── LOG ────────────────────────────────────── */
#log-wrap{padding:6px 12px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--border);min-height:52px;max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.log-line{font-size:11px;color:var(--sub);animation:fadeIn .3s}
.log-line.dmg{color:#fca5a5}
.log-line.heal{color:#86efac}
.log-line.buff{color:#93c5fd}
.log-line.crit{color:var(--gold);font-weight:700}
.log-line.dot{color:#fb923c}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ─── AÇÕES ──────────────────────────────────── */
#actions-area{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.action-section h4{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.action-grid.wide{grid-template-columns:repeat(2,1fr)}
.action-grid.spells{grid-template-columns:repeat(3,1fr)}
.abtn{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .15s;position:relative;min-height:62px}
.abtn:active{transform:scale(.91);opacity:.7}
.abtn.selected{border-color:var(--gold);background:#1a1400;box-shadow:0 0 12px #f59e0b44}
.abtn.disabled{opacity:.35;pointer-events:none}
.abtn-icon{font-size:22px;line-height:1}
.abtn-label{font-size:9px;color:var(--sub);text-align:center;line-height:1.2}
.abtn-cost{font-size:8px;color:var(--blue);font-weight:600}
.abtn-cd{position:absolute;top:3px;right:5px;font-size:8px;color:var(--red);font-weight:700}
.abtn-energy{position:absolute;top:3px;left:5px;font-size:8px;color:var(--gold)}
.confirm-wrap{padding:0 12px 10px}
#btn-confirm{width:100%;padding:14px;background:linear-gradient(135deg,var(--c1),var(--c2));border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px;opacity:.4;transition:opacity .2s;box-shadow:0 4px 20px #7c3aed44}
#btn-confirm.active{opacity:1}
#btn-confirm:active{transform:scale(.97)}
#waiting-msg{text-align:center;font-size:13px;color:var(--gold);padding:10px;animation:pulse-big 1.4s infinite}

/* ─── OVERLAY RESULTADO ────────────────────────── */
#result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
#result-overlay.hidden{display:none}
#result-icon{font-size:72px;animation:bounce .6s}
@keyframes bounce{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
#result-title{font-size:32px;font-weight:800;color:var(--gold)}
#result-sub{font-size:14px;color:var(--sub);text-align:center}
#result-xp{font-size:18px;font-weight:700;color:var(--green)}
#btn-replay{padding:14px 36px;background:var(--c1);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}

/* ─── OVERLAY ROUND ─────────────────────────── */
#round-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none}
#round-overlay.hidden{display:none}
#round-label{font-size:40px;font-weight:800;color:#fff;text-shadow:0 0 30px #7c3aed}
#round-sub{font-size:16px;color:var(--sub)}

/* ─── DISCONNECT ──────────────────────────────── */
#reconn-bar{position:fixed;top:0;left:0;right:0;background:var(--c1);color:#fff;text-align:center;padding:7px;font-size:12px;font-weight:700;z-index:200;display:none}

/* ─── TIMER BAR ──────────────────────────────── */
#timer-bar-wrap{height:4px;background:#1a1a3a;width:100%}
#timer-bar{height:100%;background:var(--gold);transition:width 1s linear;width:100%}

/* ─── POTIONS ───────────────────────────────── */
.potion-dots{display:flex;gap:3px;margin-top:2px}
.potion-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.potion-dot.used{background:#1a1a3a}

/* ─── SCROLL INDICATOR ──────────────────────── */
#scroll-hint{text-align:center;font-size:10px;color:var(--border);padding:4px;animation:pulse-big 2s infinite}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="reconn-bar">🔄 Reconectando...</div>

<!-- WAITING -->
<div class="screen" id="screen-wait">
  <div id="wait-swords">⚔️</div>
  <div id="wait-title">DUEL ARENA</div>
  <div id="wait-sub" style="margin-bottom:8px">Entrando na arena...</div>
  <div class="spinner"></div>
  <div id="wait-status" style="margin-top:16px;font-size:13px;color:#94a3b8">Conectando...</div>
</div>

<!-- ARENA -->
<div class="screen hidden" id="screen-arena">
  <div id="arena-inner">

    <!-- HUD TOPO -->
    <div id="hud-top">
      <div class="hud-player" id="hud-p1">
        <div class="hud-name" id="p1-name">Você</div>
        <div class="hud-bars">
          <div class="bar-row"><span class="bar-icon">❤️</span><div class="bar-wrap" style="flex:1"><div class="bar-hp" id="p1-hp-bar" style="width:100%"></div></div><span class="bar-label" id="p1-hp-val">200</span></div>
          <div class="bar-row"><span class="bar-icon">🔵</span><div class="bar-wrap" style="flex:1"><div class="bar-mana" id="p1-mana-bar" style="width:100%"></div></div><span class="bar-label" id="p1-mana-val">120</span></div>
          <div class="bar-row"><span class="bar-icon">⚡</span><div class="bar-wrap" style="flex:1"><div class="bar-energy" id="p1-energy-bar" style="width:100%"></div></div><span class="bar-label" id="p1-energy-val">100</span></div>
        </div>
        <div class="hud-effects" id="p1-effects"></div>
        <div class="potion-dots" id="p1-potions"></div>
      </div>

      <div class="hud-mid">
        <div id="round-badge">Round 1</div>
        <div id="turn-indicator">Escolha sua ação</div>
      </div>

      <div class="hud-player right" id="hud-p2">
        <div class="hud-name" id="p2-name">Inimigo</div>
        <div class="hud-bars">
          <div class="bar-row"><span class="bar-label" id="p2-hp-val" style="text-align:right">200</span><div class="bar-wrap" style="flex:1"><div class="bar-hp" id="p2-hp-bar" style="width:100%"></div></div><span class="bar-icon">❤️</span></div>
          <div class="bar-row"><span class="bar-label" id="p2-mana-val" style="text-align:right">120</span><div class="bar-wrap" style="flex:1"><div class="bar-mana" id="p2-mana-bar" style="width:100%"></div></div><span class="bar-icon">🔵</span></div>
          <div class="bar-row"><span class="bar-label" id="p2-energy-val" style="text-align:right">100</span><div class="bar-wrap" style="flex:1"><div class="bar-energy" id="p2-energy-bar" style="width:100%"></div></div><span class="bar-icon">⚡</span></div>
        </div>
        <div class="hud-effects" id="p2-effects" style="justify-content:flex-end"></div>
        <div class="potion-dots" id="p2-potions" style="justify-content:flex-end"></div>
      </div>
    </div>

    <!-- TIMER -->
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>

    <!-- CANVAS ARENA -->
    <div id="arena-canvas-wrap">
      <canvas id="arena-canvas"></canvas>
      <div id="dmg-layer"></div>
    </div>

    <!-- LOG -->
    <div id="log-wrap">
      <div class="log-line" style="color:#4a4a6a;font-size:10px">Histórico de ações aparece aqui...</div>
    </div>

    <!-- AÇÕES FÍSICAS -->
    <div id="actions-area">
      <div class="action-section">
        <h4>⚔️ Ataques & Defesa</h4>
        <div class="action-grid" id="grid-physical"></div>
      </div>
      <div class="action-section">
        <h4>🔮 Magias</h4>
        <div class="action-grid spells" id="grid-spells"></div>
      </div>
      <div id="scroll-hint">↕ Role para ver mais magias</div>
    </div>

    <!-- CONFIRMAR -->
    <div class="confirm-wrap">
      <div id="waiting-msg" style="display:none"></div>
      <button id="btn-confirm" disabled>Escolher ação</button>
    </div>

  </div>
</div>

<!-- OVERLAY ROUND -->
<div id="round-overlay" class="hidden">
  <div id="round-label">Round 1</div>
  <div id="round-sub">Prepare-se!</div>
</div>

<!-- OVERLAY RESULTADO -->
<div id="result-overlay" class="hidden">
  <div id="result-icon">🏆</div>
  <div id="result-title">VITÓRIA!</div>
  <div id="result-sub"></div>
  <div id="result-xp"></div>
  <button id="btn-replay">🔄 Jogar Novamente</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════
// PARAMS
// ═══════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const ROOM   = params.get('room');
const PSLOT  = params.get('player');  // 'p1' ou 'p2'
const ENEMY  = PSLOT === 'p1' ? 'p2' : 'p1';

if (!ROOM || !['p1','p2'].includes(PSLOT)) {
  document.body.innerHTML = '<p style="color:red;padding:30px;font-size:18px">⚠️ Link inválido.</p>';
  throw new Error('bad link');
}

// ═══════════════════════════════════════════════
// DEFINIÇÕES DAS AÇÕES (espelho do servidor)
// ═══════════════════════════════════════════════
const ACTIONS_DEF = {
  ataque_leve:    { icon:'⚔️',  label:'Ataque Leve',    type:'physical', energyCost:0,  manaCost:0,  cd:0 },
  ataque_pesado:  { icon:'💢',  label:'Ataque Pesado',  type:'physical', energyCost:20, manaCost:0,  cd:0 },
  investida:      { icon:'🏃',  label:'Investida',      type:'physical', energyCost:15, manaCost:0,  cd:1 },
  quebrar_defesa: { icon:'🔨',  label:'Quebrar Def.',   type:'physical', energyCost:25, manaCost:0,  cd:2 },
  defender:       { icon:'🛡️',  label:'Defender',       type:'reactive', energyCost:0,  manaCost:0,  cd:0 },
  esquiva:        { icon:'💨',  label:'Esquiva',         type:'reactive', energyCost:10, manaCost:0,  cd:0 },
  contra_ataque:  { icon:'↩️',  label:'Contra-ataque',  type:'reactive', energyCost:20, manaCost:0,  cd:1 },
  concentrar:     { icon:'🧘',  label:'Concentrar',     type:'utility',  energyCost:0,  manaCost:0,  cd:0 },
  usar_pocao:     { icon:'🧪',  label:'Usar Poção',     type:'utility',  energyCost:0,  manaCost:0,  cd:0 },
  provocar:       { icon:'😤',  label:'Provocar',       type:'utility',  energyCost:5,  manaCost:0,  cd:3 },
  cura:           { icon:'💚',  label:'Cura',           type:'spell',    energyCost:0,  manaCost:35, cd:2 },
  bola_de_fogo:   { icon:'🔥',  label:'Bola de Fogo',  type:'spell',    energyCost:0,  manaCost:25, cd:1 },
  raio:           { icon:'⚡',  label:'Raio',           type:'spell',    energyCost:0,  manaCost:35, cd:2 },
  gelo:           { icon:'🧊',  label:'Tempest. Gelo',  type:'spell',    energyCost:0,  manaCost:30, cd:3 },
  veneno:         { icon:'☠️',  label:'Veneno',         type:'spell',    energyCost:0,  manaCost:20, cd:2 },
  escudo_magico:  { icon:'🛡️',  label:'Escudo Mágico', type:'spell',    energyCost:0,  manaCost:28, cd:3 },
  tornado:        { icon:'🌪️',  label:'Tornado',        type:'spell',    energyCost:0,  manaCost:30, cd:3 },
  sombra:         { icon:'🌑',  label:'Sombra',         type:'spell',    energyCost:0,  manaCost:22, cd:2 },
  explosao_arcana:{ icon:'💥',  label:'Explosão Arcana',type:'spell',   energyCost:0,  manaCost:60, cd:4 },
  prisao_gelo:    { icon:'❄️',  label:'Prisão de Gelo', type:'spell',   energyCost:0,  manaCost:40, cd:4 },
  maldicao:       { icon:'🔮',  label:'Maldição',       type:'spell',    energyCost:0,  manaCost:25, cd:3 },
  vampirismo:     { icon:'🩸',  label:'Vampirismo',     type:'spell',    energyCost:0,  manaCost:32, cd:3 },
};

const PHYSICAL_IDS = ['ataque_leve','ataque_pesado','investida','quebrar_defesa','defender','esquiva','contra_ataque','concentrar','usar_pocao','provocar'];
const SPELL_IDS    = ['cura','bola_de_fogo','raio','gelo','veneno','escudo_magico','tornado','sombra','explosao_arcana','prisao_gelo','maldicao','vampirismo'];

// ═══════════════════════════════════════════════
// FUNDO ANIMADO
// ═══════════════════════════════════════════════
const bgCv  = document.getElementById('bg-canvas');
const bgCtx = bgCv.getContext('2d');
const stars = [];

function initBg() {
  bgCv.width  = window.innerWidth;
  bgCv.height = window.innerHeight;
  stars.length = 0;
  for (let i = 0; i < 60; i++) {
    stars.push({ x: Math.random()*bgCv.width, y: Math.random()*bgCv.height,
                 r: Math.random()*1.4+.3, a: Math.random(), da: Math.random()*.012+.003 });
  }
}
window.addEventListener('resize', initBg);
initBg();

// Partículas mágicas flutuantes
const particles = [];
function spawnParticle() {
  particles.push({ x: Math.random()*bgCv.width, y: bgCv.height + 10,
                   vx: (Math.random()-.5)*.6, vy: -(Math.random()*1.5+0.4),
                   life: 1, decay: Math.random()*.008+.004,
                   r: Math.random()*3+1, hue: Math.random()*60+240 });
}

function drawBg(ts) {
  const W = bgCv.width, H = bgCv.height;
  bgCtx.fillStyle = '#07071a';
  bgCtx.fillRect(0, 0, W, H);

  // Gradiente de fundo
  const grd = bgCtx.createRadialGradient(W/2, H*0.3, 0, W/2, H*0.3, H*.7);
  grd.addColorStop(0, 'rgba(124,58,237,0.08)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = grd;
  bgCtx.fillRect(0, 0, W, H);

  // Estrelas
  for (const s of stars) {
    s.a += s.da; if (s.a > 1 || s.a < 0) s.da *= -1;
    bgCtx.globalAlpha = s.a * 0.7;
    bgCtx.fillStyle = '#fff';
    bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); bgCtx.fill();
  }

  // Partículas
  if (Math.random() < 0.12) spawnParticle();
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    bgCtx.globalAlpha = p.life * 0.5;
    bgCtx.fillStyle = `hsl(${p.hue},80%,65%)`;
    bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); bgCtx.fill();
  }

  bgCtx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════
// CANVAS DA ARENA (personagens 2D)
// ═══════════════════════════════════════════════
const arenaCv  = document.getElementById('arena-canvas');
const arenaCtx = arenaCv.getContext('2d');
let arenaFrame = 0;
let arenaState = { p1: null, p2: null };
let shakeFrames = 0;

function resizeArena() {
  const wrap    = document.getElementById('arena-canvas-wrap');
  arenaCv.width  = wrap.offsetWidth;
  arenaCv.height = wrap.offsetHeight;
}
window.addEventListener('resize', resizeArena);

// Personagem pixel art simples
function drawChar(ctx, x, y, color, flipped, state, frame, slot) {
  ctx.save();
  if (flipped) { ctx.translate(x, y); ctx.scale(-1, 1); ctx.translate(-x, -y); }

  const sc   = 1.8;
  const by   = state === 'idle' ? Math.sin(frame * 0.06) * 2 : 0;
  const atk  = state === 'attack' ? Math.abs(Math.sin(frame * 0.25)) * 14 : 0;
  const hurt  = state === 'hurt'   ? Math.sin(frame * 0.5) * 4 : 0;

  const dark = shadeHex(color, -50);
  const lite = shadeHex(color, +60);

  // Sombra
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 16*sc, 4*sc, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  const ox = (flipped ? -1 : 1) * atk;

  // Pernas
  ctx.fillStyle = dark;
  ctx.fillRect((x-6)*sc/2 + x*.5, (y-10 + by)*1, 5*sc*.4, 10*sc*.4);
  ctx.fillRect((x+1)*sc/2 + x*.5, (y-10 + by)*1, 5*sc*.4, 10*sc*.4);

  // Corpo
  ctx.fillStyle = color;
  ctx.fillRect(x - 9, y - 30 + by, 18, 18);
  ctx.fillStyle = lite;
  ctx.fillRect(x - 6, y - 28 + by, 12, 10);

  // Cabeça
  ctx.fillStyle = '#d4a96a';
  ctx.fillRect(x - 7, y - 46 + by, 14, 13);
  ctx.fillStyle = color;
  ctx.fillRect(x - 8, y - 50 + by, 16, 6);

  // Olhos
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 5, y - 45 + by, 3, 3);
  ctx.fillRect(x + 2, y - 45 + by, 3, 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 4, y - 44 + by, 2, 2);
  ctx.fillRect(x + 3, y - 44 + by, 2, 2);

  // Arma
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(x + 8 + ox, y - 36 + by, 3, 20);
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(x + 5 + ox, y - 20 + by, 9, 3);

  // Efeito hurt
  if (state === 'hurt') {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(x - 10, y - 52 + by, 22, 58);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function shadeHex(hex, amt) {
  try {
    const r = clamp(parseInt(hex.slice(1,3),16)+amt, 0, 255);
    const g = clamp(parseInt(hex.slice(3,5),16)+amt, 0, 255);
    const b = clamp(parseInt(hex.slice(5,7),16)+amt, 0, 255);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  } catch(e) { return hex; }
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

let p1CharState = 'idle', p2CharState = 'idle';
let p1CharTimer = 0,      p2CharTimer = 0;

function drawArena(ts) {
  if (!arenaCv.width) return;
  arenaFrame++;
  const W = arenaCv.width, H = arenaCv.height;
  const mx = W/2, fl = H - 10;

  // Shake
  let sx = 0, sy = 0;
  if (shakeFrames > 0) { sx = (Math.random()-.5)*8; sy = (Math.random()-.5)*8; shakeFrames--; }

  arenaCtx.save();
  arenaCtx.translate(sx, sy);

  // Fundo arena
  arenaCtx.fillStyle = '#050510';
  arenaCtx.fillRect(0, 0, W, H);

  // Chão
  const fg = arenaCtx.createLinearGradient(0, fl-6, 0, fl+10);
  fg.addColorStop(0, '#1e2a1e'); fg.addColorStop(1, '#050510');
  arenaCtx.fillStyle = fg;
  arenaCtx.fillRect(0, fl-6, W, 20);
  arenaCtx.strokeStyle = '#22c55e44'; arenaCtx.lineWidth = 1.5;
  arenaCtx.beginPath(); arenaCtx.moveTo(0, fl-6); arenaCtx.lineTo(W, fl-6); arenaCtx.stroke();

  // Tochas
  drawTorch(arenaCtx, 30,  fl-40, arenaFrame);
  drawTorch(arenaCtx, W-30, fl-40, arenaFrame);

  // VS label centro
  arenaCtx.globalAlpha = 0.15;
  arenaCtx.fillStyle = '#7c3aed';
  arenaCtx.font = 'bold 28px system-ui';
  arenaCtx.textAlign = 'center';
  arenaCtx.fillText('VS', mx, fl-20);
  arenaCtx.globalAlpha = 1;

  // Personagens
  if (p1CharTimer > 0) { p1CharTimer--; if (!p1CharTimer) p1CharState = 'idle'; }
  if (p2CharTimer > 0) { p2CharTimer--; if (!p2CharTimer) p2CharState = 'idle'; }

  const p1c = arenaState.p1?.skin || '#3b82f6';
  const p2c = arenaState.p2?.skin || '#ef4444';
  drawChar(arenaCtx, W*0.25, fl-8, p1c, false, p1CharState, arenaFrame, 'p1');
  drawChar(arenaCtx, W*0.75, fl-8, p2c, true,  p2CharState, arenaFrame, 'p2');

  arenaCtx.restore();
}

function drawTorch(ctx, x, y, frame) {
  // Poste
  ctx.fillStyle = '#92400e';
  ctx.fillRect(x-2, y, 4, 18);
  // Chama
  const flicker = Math.sin(frame*0.2)*3;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.moveTo(x, y-8); ctx.lineTo(x-5, y+flicker); ctx.lineTo(x+5, y+flicker); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.moveTo(x, y-12); ctx.lineTo(x-3, y+flicker); ctx.lineTo(x+3, y+flicker); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════
function gameLoop(ts) {
  drawBg(ts);
  drawArena(ts);
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// ═══════════════════════════════════════════════
// ESTADO DO JOGO
// ═══════════════════════════════════════════════
let gameState    = null;
let selectedAct  = null;
let actionLocked = false;
let timerInterval = null;
let timerLeft    = 60;

// ═══════════════════════════════════════════════
// CONSTRUÇÃO DOS BOTÕES DE AÇÃO
// ═══════════════════════════════════════════════
function buildActionButtons() {
  buildGrid('grid-physical', PHYSICAL_IDS);
  buildGrid('grid-spells',   SPELL_IDS);
}

function buildGrid(gridId, ids) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  for (const id of ids) {
    const def = ACTIONS_DEF[id];
    if (!def) continue;
    const btn = document.createElement('div');
    btn.className = 'abtn';
    btn.dataset.id = id;

    const costParts = [];
    if (def.energyCost > 0) costParts.push(`⚡${def.energyCost}`);
    if (def.manaCost   > 0) costParts.push(`🔵${def.manaCost}`);

    btn.innerHTML = `
      <span class="abtn-icon">${def.icon}</span>
      <span class="abtn-label">${def.label}</span>
      ${costParts.length ? `<span class="abtn-cost">${costParts.join(' ')}</span>` : ''}
      <span class="abtn-cd" id="cd-${id}" style="display:none"></span>
      ${def.energyCost > 0 ? `<span class="abtn-energy">⚡${def.energyCost}</span>` : ''}
    `;
    btn.addEventListener('click', () => selectAction(id));
    grid.appendChild(btn);
  }
}

function selectAction(id) {
  if (actionLocked) return;
  const p = gameState?.[PSLOT];
  if (!p) return;

  // Verifica se pode usar
  const cd      = p.cooldowns?.[id] || 0;
  const def     = ACTIONS_DEF[id];
  if (cd > 0) { showToast(`Em cooldown! ${cd} round(s)`); return; }
  if (p.energy < def.energyCost) { showToast('Energia insuficiente!'); return; }
  if (p.mana   < def.manaCost)   { showToast('Mana insuficiente!');    return; }
  if (id === 'usar_pocao' && p.potions <= 0) { showToast('Sem poções!'); return; }

  selectedAct = id;
  document.querySelectorAll('.abtn').forEach(b => b.classList.toggle('selected', b.dataset.id === id));
  const btn = document.getElementById('btn-confirm');
  btn.textContent = `Confirmar: ${ACTIONS_DEF[id].icon} ${ACTIONS_DEF[id].label}`;
  btn.classList.add('active');
  btn.disabled = false;

  // Vibração leve
  if (navigator.vibrate) navigator.vibrate(30);
}

document.getElementById('btn-confirm').addEventListener('click', () => {
  if (!selectedAct || actionLocked) return;
  actionLocked = true;
  document.getElementById('btn-confirm').textContent = '✅ Aguardando adversário...';
  document.getElementById('btn-confirm').classList.remove('active');
  document.getElementById('btn-confirm').disabled = true;
  document.getElementById('waiting-msg').style.display = 'block';
  document.getElementById('waiting-msg').textContent = '⏳ Aguardando adversário escolher...';
  document.querySelectorAll('.abtn').forEach(b => b.classList.add('disabled'));

  socket.emit('duel_action', { roomId: ROOM, slot: PSLOT, actionId: selectedAct });
});

document.getElementById('btn-replay').addEventListener('click', () => location.reload());

// ═══════════════════════════════════════════════
// ATUALIZAR HUD
// ═══════════════════════════════════════════════
function updateHUD(state) {
  if (!state) return;
  gameState = state;

  const p1 = state.p1, p2 = state.p2;
  if (!p1 || !p2) return;

  // Determina quem é "eu" e quem é "inimigo"
  const me  = state[PSLOT];
  const foe = state[ENEMY];

  updatePlayerHUD('p1', p1, p1 === me ? 'Você' : 'Inimigo');
  updatePlayerHUD('p2', p2, p2 === me ? 'Você' : 'Inimigo');

  document.getElementById('round-badge').textContent = `Round ${state.round}`;

  // Cores dos personagens na arena
  arenaState.p1 = p1;
  arenaState.p2 = p2;

  // Atualiza botões (cooldown / disable)
  updateActionButtons(me);
}

function updatePlayerHUD(slot, p, label) {
  const maxHp   = p.maxHp   || 200;
  const maxMana = p.maxMana  || 120;
  const maxEn   = p.maxEnergy || 100;

  document.getElementById(`${slot}-name`).textContent = label;
  document.getElementById(`${slot}-hp-bar`).style.width    = `${(p.hp/maxHp*100).toFixed(1)}%`;
  document.getElementById(`${slot}-mana-bar`).style.width  = `${(p.mana/maxMana*100).toFixed(1)}%`;
  document.getElementById(`${slot}-energy-bar`).style.width= `${(p.energy/maxEn*100).toFixed(1)}%`;
  document.getElementById(`${slot}-hp-val`).textContent    = Math.max(0,Math.round(p.hp));
  document.getElementById(`${slot}-mana-val`).textContent  = Math.max(0,Math.round(p.mana));
  document.getElementById(`${slot}-energy-val`).textContent= Math.max(0,Math.round(p.energy));

  // Efeitos
  const effWrap = document.getElementById(`${slot}-effects`);
  const EFF_ICONS = { burning:'🔥', poison:'☠️', frozen:'🧊', stunned:'⚡', cursed:'🔮',
                      taunted:'😤', sombra_buff:'🌑', focused:'✨', defense_broken:'💔', regen:'💚' };
  effWrap.innerHTML = (p.effects || []).map(e =>
    `<span class="eff-chip">${EFF_ICONS[e.type]||'?'} ${e.rounds}r</span>`
  ).join('');

  // Poções
  const potWrap = document.getElementById(`${slot}-potions`);
  let dots = '';
  for (let i = 0; i < (p.potions || 0); i++) dots += '<div class="potion-dot"></div>';
  for (let i = p.potions; i < 3; i++)        dots += '<div class="potion-dot used"></div>';
  potWrap.innerHTML = dots;
}

function updateActionButtons(me) {
  if (!me) return;
  for (const id of [...PHYSICAL_IDS, ...SPELL_IDS]) {
    const btn = document.querySelector(`[data-id="${id}"]`);
    const def = ACTIONS_DEF[id];
    if (!btn || !def) continue;
    const cd = me.cooldowns?.[id] || 0;
    const noEnergy = me.energy < def.energyCost;
    const noMana   = me.mana   < def.manaCost;
    const noPot    = id === 'usar_pocao' && me.potions <= 0;

    const cdEl = document.getElementById(`cd-${id}`);
    if (cdEl) { cdEl.textContent = cd > 0 ? cd+'r' : ''; cdEl.style.display = cd > 0 ? '' : 'none'; }

    btn.classList.toggle('disabled', (cd > 0 || noEnergy || noMana || noPot) && !actionLocked);
  }
}

// ═══════════════════════════════════════════════
// LOG DE BATALHA
// ═══════════════════════════════════════════════
function addLog(text, type) {
  const wrap = document.getElementById('log-wrap');
  const line = document.createElement('div');
  line.className = `log-line ${type || ''}`;
  line.textContent = text;
  wrap.appendChild(line);
  // Mantém últimas 20 linhas
  while (wrap.children.length > 20) wrap.removeChild(wrap.firstChild);
  wrap.scrollTop = wrap.scrollHeight;
}

// ═══════════════════════════════════════════════
// DANO FLUTUANTE
// ═══════════════════════════════════════════════
function spawnFloat(text, target, type) {
  const layer = document.getElementById('dmg-layer');
  const div   = document.createElement('div');
  div.className = `dmg-float ${type || ''}`;
  div.textContent = text;
  const isP1Side = target === 'p1';
  div.style.left = isP1Side ? '20%' : '60%';
  div.style.top  = `${20 + Math.random()*30}%`;
  div.style.color = type === 'heal' ? '#22c55e' : type === 'crit' ? '#f59e0b' : '#ef4444';
  layer.appendChild(div);
  setTimeout(() => div.remove(), 950);
}

// ═══════════════════════════════════════════════
// PROCESSAR EVENTOS DO ROUND
// ═══════════════════════════════════════════════
function processEvents(events) {
  if (!events) return;
  let delay = 0;
  for (const ev of events) {
    setTimeout(() => handleEvent(ev), delay);
    delay += 220;
  }
  return delay;
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'damage':
    case 'crit':
      spawnFloat(`-${ev.dmg}`, ev.target, ev.type === 'crit' ? 'crit' : '');
      addLog(ev.label, ev.type === 'crit' ? 'crit' : 'dmg');
      if (ev.target === PSLOT) {
        shakeFrames = 8;
        if (navigator.vibrate) navigator.vibrate(ev.type === 'crit' ? [80,30,80] : 60);
      }
      if (ev.target === 'p1') p1CharState = 'hurt'; else p2CharState = 'hurt';
      setTimeout(() => { if (ev.target === 'p1') p1CharState = 'idle'; else p2CharState = 'idle'; }, 600);
      break;
    case 'heal':
      spawnFloat(`+${ev.val}`, ev.target, 'heal');
      addLog(ev.label, 'heal');
      break;
    case 'mana':
      addLog(ev.label, 'buff');
      break;
    case 'dot':
      spawnFloat(`-${ev.dmg}`, ev.target, '');
      addLog(ev.label, 'dot');
      if (ev.target === PSLOT && navigator.vibrate) navigator.vibrate(40);
      break;
    case 'dodge':
      spawnFloat('ESQUIVOU!', ev.target, 'miss');
      addLog(ev.label, 'buff');
      break;
    case 'counter':
      spawnFloat(`↩️-${ev.dmg}`, ev.target, 'crit');
      addLog(ev.label, 'crit');
      break;
    case 'absorb':
      spawnFloat(`🛡️-${ev.val}`, ev.target, 'miss');
      addLog(ev.label, 'buff');
      break;
    case 'buff':
    case 'debuff':
    case 'cancel':
    case 'shield':
      addLog(ev.label, 'buff');
      break;
  }

  // Anima atacante
  if (ev.actionId) {
    const isP1Action = ev.target !== 'p1'; // atacante é o oposto do alvo
    if (isP1Action) { p1CharState = 'attack'; p1CharTimer = 18; }
    else            { p2CharState = 'attack'; p2CharTimer = 18; }
  }
}

// ═══════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════
function startTimer(seconds) {
  clearInterval(timerInterval);
  timerLeft = seconds;
  const bar = document.getElementById('timer-bar');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  // Força reflow
  bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = '0%';

  timerInterval = setInterval(() => {
    timerLeft--;
    if (timerLeft <= 10) bar.style.background = '#ef4444';
    if (timerLeft <= 0) { clearInterval(timerInterval); }
  }, 1000);
}

// ═══════════════════════════════════════════════
// ROUND OVERLAY
// ═══════════════════════════════════════════════
function showRoundOverlay(round, sub, duration) {
  const ov = document.getElementById('round-overlay');
  document.getElementById('round-label').textContent = round;
  document.getElementById('round-sub').textContent   = sub || '';
  ov.classList.remove('hidden');
  setTimeout(() => ov.classList.add('hidden'), duration || 2000);
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e1e48;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:300;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.style.opacity = '0', 1800);
}

// ═══════════════════════════════════════════════
// TRANSIÇÃO PARA ARENA
// ═══════════════════════════════════════════════
function showArena() {
  document.getElementById('screen-wait').classList.add('hidden');
  document.getElementById('screen-arena').classList.remove('hidden');
  resizeArena();
  buildActionButtons();
}

// ═══════════════════════════════════════════════
// SOCKET
// ═══════════════════════════════════════════════
const socket = io({ reconnectionDelay: 1500, reconnectionAttempts: 20 });

socket.on('connect', () => {
  document.getElementById('reconn-bar').style.display = 'none';
  document.getElementById('wait-status').textContent = 'Conectado! Entrando na arena...';
  socket.emit('duel_join', { roomId: ROOM, slot: PSLOT });
});

socket.on('disconnect', () => {
  document.getElementById('reconn-bar').style.display = 'block';
});

socket.on('reconnect', () => {
  document.getElementById('reconn-bar').style.display = 'none';
  socket.emit('duel_join', { roomId: ROOM, slot: PSLOT });
});

socket.on('duel_waiting', ({ msg }) => {
  document.getElementById('wait-status').textContent = msg || 'Esperando adversário...';
  document.getElementById('wait-sub').textContent    = 'Esperando adversário entrar...';
});

socket.on('duel_opponent_joined', () => {
  document.getElementById('wait-status').textContent = '✅ Adversário entrou! Iniciando...';
});

socket.on('duel_state', state => {
  if (!state) return;
  gameState = state;
  // Se já estiver em luta e na tela errada, mostra arena
  if (state.phase === 'fight' && document.getElementById('screen-arena').classList.contains('hidden')) {
    showArena();
  }
  updateHUD(state);
});

socket.on('duel_start', state => {
  showArena();
  updateHUD(state);
  showRoundOverlay(`⚔️ Round ${state.round}`, 'Escolha sua ação!', 2200);
  addLog('━━ Batalha iniciada! ━━', 'buff');
  startTimer(60);
});

socket.on('duel_action_confirmed', ({ actionId }) => {
  const def = ACTIONS_DEF[actionId];
  addLog(`✅ Você escolheu: ${def?.icon} ${def?.label}`, 'buff');
});

socket.on('duel_opponent_ready', () => {
  document.getElementById('turn-indicator').textContent = '✅ Adversário pronto!';
});

socket.on('round_result', async ({ events, ended, winner, state }) => {
  clearInterval(timerInterval);

  // Pequeno overlay de processamento
  showRoundOverlay('⚔️ Resolução!', 'Processando ações...', 800);

  // Processa eventos com delay
  const totalDelay = processEvents(events);

  setTimeout(() => {
    updateHUD(state);

    if (ended) {
      setTimeout(() => showResult(winner, state), 800);
    } else {
      // Próximo round
      setTimeout(() => {
        showRoundOverlay(`⚔️ Round ${state.round}`, 'Novo round! Escolha sua ação.', 2000);
        resetForNextRound();
        startTimer(60);
      }, 600);
    }
  }, totalDelay + 400);
});

socket.on('duel_disconnect', ({ slot }) => {
  if (slot === ENEMY) addLog('⚠️ Adversário desconectou!', 'dot');
});

socket.on('duel_error', msg => showToast('⚠️ ' + msg));

// ═══════════════════════════════════════════════
// RESET PARA PRÓXIMO ROUND
// ═══════════════════════════════════════════════
function resetForNextRound() {
  selectedAct  = null;
  actionLocked = false;
  document.getElementById('btn-confirm').textContent = 'Escolher ação';
  document.getElementById('btn-confirm').classList.remove('active');
  document.getElementById('btn-confirm').disabled = true;
  document.getElementById('waiting-msg').style.display = 'none';
  document.getElementById('turn-indicator').textContent = 'Escolha sua ação';
  document.querySelectorAll('.abtn').forEach(b => b.classList.remove('selected','disabled'));
  if (gameState) updateActionButtons(gameState[PSLOT]);
}

// ═══════════════════════════════════════════════
// TELA DE RESULTADO
// ═══════════════════════════════════════════════
function showResult(winner, state) {
  const won  = winner === PSLOT;
  const draw = winner === 'draw';

  document.getElementById('result-icon').textContent  = draw ? '🤝' : won ? '🏆' : '💀';
  document.getElementById('result-title').textContent = draw ? 'EMPATE!'  : won ? 'VITÓRIA!' : 'DERROTA';
  document.getElementById('result-sub').textContent   = draw
    ? 'Ambos lutaram com honra!'
    : won ? 'Você dominou o campo de batalha!' : 'O adversário foi mais forte dessa vez.';
  document.getElementById('result-xp').textContent = draw ? '+20 XP' : won ? '+100 XP' : '-100 XP';
  document.getElementById('result-overlay').classList.remove('hidden');

  if (navigator.vibrate) navigator.vibrate(won ? [100,50,100,50,200] : [200,100,200]);
}
